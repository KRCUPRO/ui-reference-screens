<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spacing Tokens Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "secondary-container": "#2170e4",
            "on-primary": "#ffffff",
            "tertiary-fixed-dim": "#dcc2a4",
            "surface-bright": "#f8f9fa",
            "surface-container-lowest": "#ffffff",
            "tertiary-container": "#261906",
            "secondary-fixed": "#d8e2ff",
            "on-tertiary-fixed-variant": "#55442d",
            "primary-container": "#141b2b",
            "inverse-primary": "#c0c6db",
            "inverse-surface": "#2e3132",
            "primary": "#000000",
            "error": "#ba1a1a",
            "surface-container-highest": "#e1e3e4",
            "primary-fixed": "#dce2f7",
            "secondary": "#0058be",
            "on-primary-fixed-variant": "#404758",
            "secondary-fixed-dim": "#adc6ff",
            "on-error-container": "#93000a",
            "on-secondary-container": "#fefcff",
            "tertiary": "#000000",
            "background": "#f8f9fa",
            "surface-container-low": "#f3f4f5",
            "on-tertiary-fixed": "#261906",
            "surface-container-high": "#e7e8e9",
            "on-error": "#ffffff",
            "surface": "#f8f9fa",
            "outline": "#76777d",
            "surface-tint": "#575e70",
            "on-surface-variant": "#45464c",
            "on-tertiary-container": "#968065",
            "on-primary-container": "#7d8497",
            "surface-container": "#edeeef",
            "primary-fixed-dim": "#c0c6db",
            "on-secondary-fixed-variant": "#004395",
            "on-background": "#191c1d",
            "tertiary-fixed": "#f9debf",
            "inverse-on-surface": "#f0f1f2",
            "error-container": "#ffdad6",
            "surface-variant": "#e1e3e4",
            "outline-variant": "#c6c6cd",
            "on-primary-fixed": "#141b2b",
            "on-secondary": "#ffffff",
            "surface-dim": "#d9dadb",
            "on-secondary-fixed": "#001a42",
            "on-tertiary": "#ffffff",
            "on-surface": "#191c1d"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "gutter": "24px",
            "container-max": "1440px",
            "margin-mobile": "16px",
            "sidebar-width": "260px",
            "margin-desktop": "40px",
            "unit": "4px"
          },
          "fontFamily": {
            "headline-md": ["Inter"],
            "mono-label": ["JetBrains Mono"],
            "headline-lg-mobile": ["Inter"],
            "headline-lg": ["Inter"],
            "body-lg": ["Inter"],
            "label-sm": ["Inter"],
            "body-md": ["Inter"]
          },
          "fontSize": {
            "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "mono-label": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pt-14">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-mobile h-14 z-50 transition-colors duration-200">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80 group">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-semibold text-on-surface dark:text-on-surface">Spacing</h1>
<button class="flex items-center justify-center px-4 py-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80">
<span class="font-label-sm text-label-sm text-primary dark:text-primary-fixed font-semibold uppercase tracking-wider">Save</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 w-full max-w-lg mx-auto py-4">
<div class="flex flex-col border border-outline-variant rounded-lg bg-surface-container-lowest overflow-hidden">
<!-- xs -->
<div class="flex items-center justify-between p-4 border-b border-outline-variant bg-surface-container-lowest transition-colors hover:bg-surface-container-low">
<span class="font-body-md text-body-md font-medium">xs</span>
<div class="flex items-center bg-surface-container rounded-DEFAULT border border-outline-variant overflow-hidden">
<button aria-label="Decrease xs" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-outline-variant bg-surface-container-lowest min-w-[48px] text-center">
<span class="font-mono-label text-mono-label text-on-surface">4px</span>
</div>
<button aria-label="Increase xs" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">add</span>
</button>
</div>
</div>
<!-- sm -->
<div class="flex items-center justify-between p-4 border-b border-outline-variant bg-surface-container-lowest transition-colors hover:bg-surface-container-low">
<span class="font-body-md text-body-md font-medium">sm</span>
<div class="flex items-center bg-surface-container rounded-DEFAULT border border-outline-variant overflow-hidden">
<button aria-label="Decrease sm" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-outline-variant bg-surface-container-lowest min-w-[48px] text-center">
<span class="font-mono-label text-mono-label text-on-surface">8px</span>
</div>
<button aria-label="Increase sm" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">add</span>
</button>
</div>
</div>
<!-- md (Active/Highlighted) -->
<div class="flex items-center justify-between p-4 border-b border-secondary-fixed bg-secondary-fixed-dim/20 transition-colors">
<span class="font-body-md text-body-md font-medium text-secondary">md</span>
<div class="flex items-center bg-surface-container-lowest rounded-DEFAULT border border-secondary overflow-hidden shadow-[0_0_0_2px_rgba(33,112,228,0.2)]">
<button aria-label="Decrease md" class="p-2 hover:bg-secondary-fixed active:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-secondary text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-secondary bg-surface-container-lowest min-w-[48px] text-center relative">
<input aria-label="Value for md" class="w-full text-center p-0 border-none bg-transparent font-mono-label text-mono-label text-primary focus:ring-0" type="text" value="16px"/>
</div>
<button aria-label="Increase md" class="p-2 hover:bg-secondary-fixed active:bg-secondary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-secondary text-[16px]">add</span>
</button>
</div>
</div>
<!-- lg -->
<div class="flex items-center justify-between p-4 border-b border-outline-variant bg-surface-container-lowest transition-colors hover:bg-surface-container-low">
<span class="font-body-md text-body-md font-medium">lg</span>
<div class="flex items-center bg-surface-container rounded-DEFAULT border border-outline-variant overflow-hidden">
<button aria-label="Decrease lg" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-outline-variant bg-surface-container-lowest min-w-[48px] text-center">
<span class="font-mono-label text-mono-label text-on-surface">24px</span>
</div>
<button aria-label="Increase lg" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">add</span>
</button>
</div>
</div>
<!-- xl -->
<div class="flex items-center justify-between p-4 border-b border-outline-variant bg-surface-container-lowest transition-colors hover:bg-surface-container-low">
<span class="font-body-md text-body-md font-medium">xl</span>
<div class="flex items-center bg-surface-container rounded-DEFAULT border border-outline-variant overflow-hidden">
<button aria-label="Decrease xl" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-outline-variant bg-surface-container-lowest min-w-[48px] text-center">
<span class="font-mono-label text-mono-label text-on-surface">40px</span>
</div>
<button aria-label="Increase xl" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">add</span>
</button>
</div>
</div>
<!-- xxl -->
<div class="flex items-center justify-between p-4 bg-surface-container-lowest transition-colors hover:bg-surface-container-low">
<span class="font-body-md text-body-md font-medium">xxl</span>
<div class="flex items-center bg-surface-container rounded-DEFAULT border border-outline-variant overflow-hidden">
<button aria-label="Decrease xxl" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">remove</span>
</button>
<div class="px-3 py-2 border-x border-outline-variant bg-surface-container-lowest min-w-[48px] text-center">
<span class="font-mono-label text-mono-label text-on-surface">64px</span>
</div>
<button aria-label="Increase xxl" class="p-2 hover:bg-surface-container-high active:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">add</span>
</button>
</div>
</div>
</div>
</main>
<script>
    // Minimal interaction script for visual feedback
    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('focus', (e) => {
        const container = e.target.closest('.flex.items-center.rounded-DEFAULT');
        if(container) {
            container.classList.add('ring-2', 'ring-secondary-fixed-dim');
        }
      });
      input.addEventListener('blur', (e) => {
        const container = e.target.closest('.flex.items-center.rounded-DEFAULT');
        if(container) {
            container.classList.remove('ring-2', 'ring-secondary-fixed-dim');
        }
      });
    });
  </script>
</body></html>
