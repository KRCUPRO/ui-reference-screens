<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Colour Picker &amp; Accessibility</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "outline-variant": "#c6c6cd",
            "on-secondary-container": "#fefcff",
            "secondary-container": "#2170e4",
            "surface-container-high": "#eae7e9",
            "secondary-fixed": "#d8e2ff",
            "on-secondary-fixed-variant": "#004395",
            "on-error-container": "#93000a",
            "on-primary": "#ffffff",
            "tertiary": "#000000",
            "surface-dim": "#dcd9db",
            "tertiary-fixed": "#f9debf",
            "on-secondary": "#ffffff",
            "secondary-fixed-dim": "#adc6ff",
            "error": "#ba1a1a",
            "surface-bright": "#fcf8fa",
            "primary": "#000000",
            "background": "#fcf8fa",
            "on-primary-container": "#7d8497",
            "surface-container-low": "#f6f3f4",
            "on-background": "#1b1b1d",
            "primary-fixed-dim": "#c0c6db",
            "secondary": "#0058be",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f3f0f1",
            "on-surface-variant": "#45464c",
            "tertiary-container": "#261906",
            "on-tertiary-fixed-variant": "#55442d",
            "on-secondary-fixed": "#001a42",
            "surface-tint": "#575e70",
            "outline": "#76777d",
            "inverse-surface": "#303031",
            "tertiary-fixed-dim": "#dcc2a4",
            "primary-fixed": "#dce2f7",
            "on-surface": "#1b1b1d",
            "surface-container-lowest": "#ffffff",
            "surface-variant": "#e5e2e3",
            "on-tertiary-fixed": "#261906",
            "on-tertiary": "#ffffff",
            "surface": "#fcf8fa",
            "primary-container": "#141b2b",
            "error-container": "#ffdad6",
            "on-tertiary-container": "#968065",
            "on-primary-fixed-variant": "#404758",
            "surface-container-highest": "#e5e2e3",
            "on-primary-fixed": "#141b2b",
            "surface-container": "#f0edee",
            "inverse-primary": "#c0c6db"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "row-height-sm": "24px",
            "unit": "4px",
            "stack-tight": "0.25rem",
            "gutter": "1rem",
            "stack-base": "0.5rem",
            "row-height-md": "32px",
            "container-padding": "1.5rem"
          },
          "fontFamily": {
            "h1": ["Inter"],
            "ui-regular": ["Inter"],
            "ui-bold": ["Inter"],
            "mono-data": ["JetBrains Mono"],
            "h2": ["Inter"],
            "ui-medium": ["Inter"],
            "mono-label": ["JetBrains Mono"]
          },
          "fontSize": {
            "h1": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "ui-regular": ["13px", {"lineHeight": "16px", "fontWeight": "400"}],
            "ui-bold": ["13px", {"lineHeight": "16px", "fontWeight": "600"}],
            "mono-data": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
            "h2": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "ui-medium": ["13px", {"lineHeight": "16px", "fontWeight": "500"}],
            "mono-label": ["10px", {"lineHeight": "12px", "fontWeight": "500"}]
          }
        },
      },
    }
  </script>
<style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 2px;
    }
    *:hover::-webkit-scrollbar-thumb {
      background: #E5E7EB;
    }
    .color-field-gradient {
      background: linear-gradient(to right, #ffffff, #e5484d), linear-gradient(to top, #000000, transparent);
      background-blend-mode: multiply;
    }
    .hue-gradient {
      background: linear-gradient(to bottom, #ff0000, #ff00ff, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
    }
  </style>
</head>
<body class="bg-background text-on-background font-ui-regular min-h-screen flex items-center justify-center p-gutter selection:bg-secondary selection:text-on-secondary">
<!-- Modal Overlay -->
<div aria-labelledby="modal-title" aria-modal="true" class="fixed inset-0 bg-primary/5 flex items-center justify-center z-50 p-gutter" role="dialog">
<!-- Modal Container -->
<div class="bg-surface-container-lowest border border-outline-variant w-full max-w-[800px] flex flex-col shadow-sm">
<!-- Header -->
<div class="h-row-height-md flex items-center justify-between px-gutter border-b border-outline-variant bg-surface">
<h2 class="font-ui-bold text-ui-bold" id="modal-title">Colour Picker &amp; Accessibility</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-1 focus:ring-primary rounded-sm w-6 h-6 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<!-- Main Content (Two Columns) -->
<div class="flex flex-col md:flex-row h-auto md:h-[420px]">
<!-- Left Column: Selection -->
<div class="w-full md:w-1/2 p-gutter border-b md:border-b-0 md:border-r border-outline-variant flex flex-col gap-stack-base">
<!-- Color Field & Hue Slider -->
<div class="flex gap-stack-base h-[200px]">
<!-- Main Field -->
<div class="flex-1 border border-outline-variant relative cursor-crosshair color-field-gradient rounded-sm">
<!-- Selector Reticle -->
<div class="absolute top-[30%] left-[80%] w-4 h-4 border-2 border-white rounded-full transform -translate-x-1/2 -translate-y-1/2 shadow-sm pointer-events-none"></div>
</div>
<!-- Hue Slider -->
<div class="w-6 border border-outline-variant relative cursor-ns-resize hue-gradient rounded-sm">
<!-- Slider Handle -->
<div class="absolute top-[10%] left-[-2px] right-[-2px] h-2 border border-primary bg-white shadow-sm rounded-sm pointer-events-none"></div>
</div>
</div>
<!-- Hex Input -->
<div class="flex flex-col gap-stack-tight mt-stack-base">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">Hex</label>
<div class="flex items-center border border-outline-variant focus-within:border-primary transition-colors h-row-height-md px-stack-base rounded-sm bg-surface">
<span class="font-mono-data text-mono-data text-on-surface-variant mr-1">#</span>
<input aria-label="Hex color value" class="bg-transparent border-none p-0 m-0 w-full focus:ring-0 font-mono-data text-mono-data uppercase" type="text" value="E5484D"/>
</div>
</div>
<!-- RGB & HSB Inputs -->
<div class="grid grid-cols-2 gap-stack-base">
<div class="flex flex-col gap-stack-tight">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">RGB</label>
<div class="flex gap-1">
<input aria-label="Red" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="229"/>
<input aria-label="Green" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="72"/>
<input aria-label="Blue" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="77"/>
</div>
</div>
<div class="flex flex-col gap-stack-tight">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">HSB</label>
<div class="flex gap-1">
<input aria-label="Hue" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="358"/>
<input aria-label="Saturation" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="69"/>
<input aria-label="Brightness" class="w-full border border-outline-variant focus:border-primary focus:ring-0 h-row-height-md px-2 font-mono-data text-mono-data text-center rounded-sm bg-surface" type="text" value="90"/>
</div>
</div>
</div>
</div>
<!-- Right Column: Accessibility -->
<div class="w-full md:w-1/2 p-gutter flex flex-col bg-surface">
<div class="flex items-center gap-2 mb-stack-base">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">accessibility_new</span>
<h3 class="font-ui-bold text-ui-bold">Contrast Ratio</h3>
</div>
<div class="flex flex-col gap-stack-base flex-1">
<!-- Fail Case -->
<div class="border border-error-container bg-error-container/20 p-stack-base rounded-sm flex flex-col gap-stack-tight relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-error"></div>
<div class="flex items-center justify-between ml-2">
<div class="flex items-center gap-2">
<span class="font-mono-data text-mono-data text-on-surface">On paper</span>
</div>
<span class="font-mono-data text-mono-data font-semibold text-error">3.1:1</span>
</div>
<div class="flex items-center gap-1 ml-2 text-error">
<span class="material-symbols-outlined text-[14px]">warning</span>
<span class="font-ui-regular text-[11px] font-medium uppercase tracking-wider">Fails AA for body text</span>
</div>
</div>
<!-- Pass Case -->
<div class="border border-outline-variant bg-surface-container-lowest p-stack-base rounded-sm flex flex-col gap-stack-tight">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="font-mono-data text-mono-data text-on-surface">On surface-strong</span>
</div>
<span class="font-mono-data text-mono-data font-semibold text-secondary">5.8:1</span>
</div>
<div class="flex items-center gap-1 text-on-surface-variant">
<span class="material-symbols-outlined text-[14px] text-secondary">check_circle</span>
<span class="font-ui-regular text-[11px] font-medium uppercase tracking-wider">Passes AA</span>
</div>
</div>
<!-- Live Preview -->
<div class="mt-auto pt-stack-base flex flex-col gap-stack-tight border-t border-outline-variant">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-wider">Live Preview (White text)</label>
<div class="h-[60px] rounded-sm flex items-center justify-center p-stack-base w-full" style="background-color: #E5484D;">
<span class="font-ui-medium text-ui-medium text-white">Sample Text Legibility</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="h-row-height-md flex items-center justify-end px-gutter border-t border-outline-variant bg-surface gap-stack-base">
<button class="h-row-height-sm px-3 border border-outline-variant hover:bg-surface-container-high transition-colors font-ui-medium text-ui-medium text-on-surface rounded-sm focus:outline-none focus:ring-1 focus:ring-primary">
          Cancel
        </button>
<button class="h-row-height-sm px-4 bg-primary hover:bg-primary/90 transition-colors font-ui-medium text-ui-medium text-on-primary rounded-sm focus:outline-none focus:ring-1 focus:ring-offset-1 focus:ring-primary">
          Apply
        </button>
</div>
</div>
</div>
</body></html>
