<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Preview Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#dfdddc",
                        "primary-container": "#00ff66",
                        "secondary-container": "#474746",
                        "surface": "#121414",
                        "surface-dim": "#121414",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#e4e2e1",
                        "surface-tint": "#00e55b",
                        "tertiary": "#fcf9f9",
                        "on-primary-container": "#007128",
                        "surface-container-highest": "#333535",
                        "outline": "#849581",
                        "surface-container-lowest": "#0c0f0f",
                        "on-tertiary-fixed": "#1b1c1c",
                        "secondary": "#c8c6c5",
                        "error-container": "#93000a",
                        "on-tertiary": "#303030",
                        "tertiary-fixed-dim": "#c8c6c6",
                        "on-primary-fixed-variant": "#00531b",
                        "surface-container-low": "#1a1c1c",
                        "surface-variant": "#333535",
                        "primary": "#edffe8",
                        "inverse-primary": "#006e27",
                        "on-surface-variant": "#b9ccb5",
                        "primary-fixed-dim": "#00e55b",
                        "error": "#ffb4ab",
                        "surface-bright": "#38393a",
                        "on-tertiary-container": "#626161",
                        "secondary-fixed": "#e5e2e1",
                        "surface-container": "#1e2020",
                        "on-error": "#690005",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-secondary-container": "#b7b5b4",
                        "on-tertiary-fixed-variant": "#474747",
                        "inverse-on-surface": "#2f3131",
                        "on-secondary": "#313030",
                        "outline-variant": "#3b4b3a",
                        "on-primary": "#003911",
                        "on-background": "#e2e2e2",
                        "on-surface": "#e2e2e2",
                        "inverse-surface": "#e2e2e2",
                        "on-primary-fixed": "#002107",
                        "background": "#121414",
                        "primary-fixed": "#6bff83",
                        "surface-container-high": "#282a2b",
                        "on-secondary-fixed-variant": "#474746"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "xl": "48px",
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "base": "4px",
                        "container-max": "1280px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "code-md": ["JetBrains Mono"],
                        "headline-md": ["Inter"],
                        "code-sm": ["JetBrains Mono"],
                        "label-caps": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "code-md": ["13px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "code-sm": ["11px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "label-caps": ["10px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Desktop Centered Mobile Device Frame -->
<div class="w-[375px] h-[812px] bg-surface rounded-[40px] border-[4px] border-surface-container-highest shadow-2xl overflow-hidden flex flex-col relative">
<!-- TopAppBar Shared Component -->
<header class="bg-surface dark:bg-surface text-primary dark:text-primary docked full-width top-0 border-b border-outline-variant flat no shadows transition-colors duration-200 flex justify-between items-center w-full px-md h-14 shrink-0 z-10">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-highest text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface font-semibold truncate flex-1 text-center px-sm">
                Preview
            </h1>
<div class="flex items-center">
<button aria-label="More options" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-highest text-on-surface-variant transition-colors group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Canvas Content -->
<main class="flex-1 overflow-y-auto p-md flex flex-col gap-lg bg-surface relative z-0 hide-scrollbar">
<!-- 1. Primary Button -->
<button class="w-full bg-primary-container hover:bg-primary-fixed text-on-primary-container font-headline-md text-headline-md-mobile py-sm px-md rounded-lg flex items-center justify-center gap-sm transition-colors duration-200 active:scale-[0.98]">
<span>Save Draft</span>
</button>
<!-- Settings Group -->
<div class="flex flex-col gap-sm">
<!-- 2. Auto-sync Toggle Row -->
<div class="flex items-center justify-between p-md bg-surface-container rounded-lg border border-surface-container-highest hover:border-outline-variant transition-colors">
<span class="font-body-md text-body-md text-on-surface">Auto-sync</span>
<button aria-checked="false" class="relative inline-flex h-6 w-11 items-center rounded-full bg-surface-container-highest border border-outline-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface" id="autosync-toggle" role="switch">
<span class="inline-block h-4 w-4 transform rounded-full bg-on-surface-variant transition-transform translate-x-1" id="autosync-thumb"></span>
</button>
</div>
<!-- 3. Advanced Settings Action Row -->
<button class="flex items-center justify-between p-md bg-surface-container rounded-lg border border-surface-container-highest hover:bg-surface-container-high transition-colors w-full text-left group">
<span class="font-body-md text-body-md text-on-surface">Advanced Settings</span>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<div class="flex-1"></div> <!-- Spacer to push terminal to bottom if content is short -->
<!-- 4. Terminal-style code block -->
<div class="bg-[#0A0A0A] rounded-lg border border-surface-container-highest p-md font-code-md text-code-md text-on-surface-variant w-full overflow-x-auto shadow-inner">
<code><span class="text-secondary">status</span>: <span class="text-primary-fixed-dim">ok</span></code>
</div>
</main>
<!-- BottomNavBar Navigation Shell - Hidden for 'Preview' which implies transactional/task focus -->
<!-- Suppressed per Shared Components Logic: Transactional/Task-focused screens should hide navigation -->
</div>
<style>
        /* Custom scrollbar for mobile frame content */
        .hide-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar-thumb {
            background-color: #333535; /* surface-variant */
            border-radius: 4px;
        }
    </style>
<script>
        // Simple toggle logic for the Auto-sync switch
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('autosync-toggle');
            const thumb = document.getElementById('autosync-thumb');
            let isToggled = false;

            toggle.addEventListener('click', () => {
                isToggled = !isToggled;
                toggle.setAttribute('aria-checked', isToggled.toString());
                
                if (isToggled) {
                    toggle.classList.remove('bg-surface-container-highest', 'border-outline-variant');
                    toggle.classList.add('bg-primary-container', 'border-primary-container');
                    thumb.classList.remove('translate-x-1', 'bg-on-surface-variant');
                    thumb.classList.add('translate-x-6', 'bg-on-primary-container');
                } else {
                    toggle.classList.add('bg-surface-container-highest', 'border-outline-variant');
                    toggle.classList.remove('bg-primary-container', 'border-primary-container');
                    thumb.classList.add('translate-x-1', 'bg-on-surface-variant');
                    thumb.classList.remove('translate-x-6', 'bg-on-primary-container');
                }
            });
        });
    </script>
</body></html>
