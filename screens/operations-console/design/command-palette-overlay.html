<style>
        .backdrop-blur-md {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Custom scrollbar for the palette */
        .palette-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .palette-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .palette-scroll::-webkit-scrollbar-thumb {
            background-color: #c3c6d6;
            border-radius: 4px;
        }
        .palette-scroll {
            scrollbar-width: thin;
            scrollbar-color: #c3c6d6 transparent;
        }
        .fade-bottom {
            -webkit-mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 90%, transparent 100%);
        }
    </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

<h3 class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Navigate</h3>
</div>

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">vpn_key</span>
<span class="font-body-md text-body-md text-primary">Go to Keys</span>
</div>
<div class="flex items-center gap-1 opacity-70">
<kbd class="font-mono text-[10px] h-5 min-w-[20px] px-1 flex items-center justify-center rounded border border-outline-variant bg-surface-container-low text-on-surface-variant font-medium">G</kbd>
