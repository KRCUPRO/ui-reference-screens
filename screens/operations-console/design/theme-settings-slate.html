<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Theme Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-container-low": "#eef4ff",
              "surface-dim": "#ccdbf2",
              "surface": "#f8f9ff",
              "on-secondary-fixed": "#0b1c30",
              "on-primary-fixed": "#001a42",
              "secondary-fixed-dim": "#b7c8e1",
              "on-secondary": "#ffffff",
              "tertiary-container": "#b75b00",
              "on-primary-fixed-variant": "#004395",
              "on-error": "#ffffff",
              "on-secondary-container": "#54647a",
              "primary-container": "#2170e4",
              "error": "#ba1a1a",
              "primary": "#0058be",
              "surface-tint": "#005ac2",
              "surface-bright": "#f8f9ff",
              "on-tertiary-fixed-variant": "#723600",
              "on-tertiary": "#ffffff",
              "surface-container-highest": "#d4e4fa",
              "tertiary-fixed-dim": "#ffb786",
              "on-primary": "#ffffff",
              "inverse-primary": "#adc6ff",
              "secondary-fixed": "#d3e4fe",
              "surface-container-high": "#dbe9ff",
              "surface-container": "#e5efff",
              "on-tertiary-fixed": "#311400",
              "background": "#f8f9ff",
              "inverse-surface": "#233143",
              "secondary": "#505f76",
              "inverse-on-surface": "#e9f1ff",
              "surface-container-lowest": "#ffffff",
              "outline-variant": "#c2c6d6",
              "on-background": "#0d1c2d",
              "primary-fixed-dim": "#adc6ff",
              "on-surface-variant": "#424754",
              "error-container": "#ffdad6",
              "on-tertiary-container": "#fffbff",
              "on-primary-container": "#fefcff",
              "secondary-container": "#d0e1fb",
              "surface-variant": "#d4e4fa",
              "primary-fixed": "#d8e2ff",
              "tertiary-fixed": "#ffdcc6",
              "on-secondary-fixed-variant": "#38485d",
              "on-error-container": "#93000a",
              "tertiary": "#924700",
              "on-surface": "#0d1c2d",
              "outline": "#727785"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "container-max": "1280px",
              "gutter": "24px",
              "margin-mobile": "16px",
              "margin-desktop": "32px",
              "stack-xl": "48px",
              "stack-sm": "8px",
              "stack-xs": "4px",
              "stack-lg": "24px",
              "stack-md": "16px",
              "unit": "4px"
            },
            "fontFamily": {
              "body-sm": [
                "Public Sans"
              ],
              "body-md": [
                "Public Sans"
              ],
              "display-lg": [
                "Public Sans"
              ],
              "headline-lg": [
                "Public Sans"
              ],
              "label-md": [
                "Public Sans"
              ],
              "headline-md": [
                "Public Sans"
              ],
              "body-lg": [
                "Public Sans"
              ],
              "label-sm": [
                "Public Sans"
              ],
              "headline-lg-mobile": [
                "Public Sans"
              ]
            },
            "fontSize": {
              "body-sm": [
                "14px",
                {
                  "lineHeight": "20px",
                  "fontWeight": "400"
                }
              ],
              "body-md": [
                "16px",
                {
                  "lineHeight": "24px",
                  "fontWeight": "400"
                }
              ],
              "display-lg": [
                "48px",
                {
                  "lineHeight": "56px",
                  "letterSpacing": "-0.02em",
                  "fontWeight": "700"
                }
              ],
              "headline-lg": [
                "32px",
                {
                  "lineHeight": "40px",
                  "letterSpacing": "-0.01em",
                  "fontWeight": "600"
                }
              ],
              "label-md": [
                "14px",
                {
                  "lineHeight": "20px",
                  "letterSpacing": "0.01em",
                  "fontWeight": "600"
                }
              ],
              "headline-md": [
                "24px",
                {
                  "lineHeight": "32px",
                  "fontWeight": "600"
                }
              ],
              "body-lg": [
                "18px",
                {
                  "lineHeight": "28px",
                  "fontWeight": "400"
                }
              ],
              "label-sm": [
                "12px",
                {
                  "lineHeight": "16px",
                  "fontWeight": "500"
                }
              ],
              "headline-lg-mobile": [
                "24px",
                {
                  "lineHeight": "32px",
                  "fontWeight": "600"
                }
              ]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-surface-dim flat no shadows h-16 px-margin-mobile flex items-center">
<button aria-label="Back" class="text-primary hover:bg-surface-container active:opacity-70 transition-colors w-10 h-10 flex items-center justify-center rounded-full mr-4 flex-shrink-0">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back" data-weight="regular">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-surface flex-grow truncate tracking-tight">Theme</h1>
</header>
<!-- Main Content -->
<main class="pt-[65px] px-margin-mobile pb-stack-lg max-w-[600px] mx-auto">
<div class="bg-surface-container-lowest rounded-lg border border-surface-dim overflow-hidden shadow-sm mt-stack-md">
<!-- Light -->
<button class="w-full flex items-center px-4 py-4 hover:bg-surface-container transition-colors border-b border-surface-dim text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 overflow-hidden" style="background: linear-gradient(135deg, #ffffff 50%, #f8fafc 50%);"></div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Light</span>
</div>
</button>
<!-- Dark -->
<button class="w-full flex items-center px-4 py-4 hover:bg-surface-container transition-colors border-b border-surface-dim text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 overflow-hidden" style="background: linear-gradient(135deg, #0f172a 50%, #1e293b 50%);"></div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Dark</span>
</div>
</button>
<!-- Slate (Selected) -->
<button class="w-full flex items-center px-4 py-4 bg-surface-container-low hover:bg-surface-container transition-colors border-b border-surface-dim text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 overflow-hidden" style="background: linear-gradient(135deg, #e2e8f0 50%, #94a3b8 50%);"></div>
<div class="flex-grow">
<span class="font-label-md text-label-md text-primary">Slate</span>
</div>
<div class="w-2 h-2 rounded-full bg-primary ml-2 flex-shrink-0"></div>
</button>
<!-- OLED -->
<button class="w-full flex items-center px-4 py-4 hover:bg-surface-container transition-colors border-b border-surface-dim text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 bg-black"></div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">OLED</span>
</div>
</button>
<!-- Neon -->
<button class="w-full flex items-center px-4 py-4 hover:bg-surface-container transition-colors border-b border-surface-dim text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 overflow-hidden" style="background: linear-gradient(135deg, #000000 50%, #00f0ff 50%);"></div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">Neon</span>
</div>
</button>
<!-- System -->
<button class="w-full flex items-center px-4 py-4 hover:bg-surface-container transition-colors text-left group">
<div class="w-8 h-8 rounded-full border border-surface-dim shadow-sm flex-shrink-0 mr-4 overflow-hidden" style="background: linear-gradient(135deg, #ffffff 50%, #0f172a 50%);"></div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface">System</span>
</div>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-stack-sm px-4">
            System theme will automatically match your device settings.
        </p>
</main>
</body></html>
