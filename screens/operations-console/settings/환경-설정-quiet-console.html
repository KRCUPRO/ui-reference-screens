<script>
        // Simple interactivity for the toggle switch and radio buttons to feel complete
        document.addEventListener('DOMContentLoaded', () => {
            // Theme selection mock
            const themeLabels = document.querySelectorAll('label.group');
            themeLabels.forEach(label => {
                label.addEventListener('click', (e) => {
                    // Reset all
                    themeLabels.forEach(l => {
                        const spanBox = l.querySelector('span:first-child');
                        const spanText = l.querySelector('span:last-child');
                        spanBox.className = 'w-[12px] h-[12px] border border-on-surface-variant group-hover:border-primary-container flex-shrink-0';
                        spanText.className = 'text-[#4A524D]';
                    });
                    // Set active
                    const targetBox = label.querySelector('span:first-child');
                    const targetText = label.querySelector('span:last-child');
                    targetBox.className = 'w-[12px] h-[12px] border border-primary-container bg-primary-container flex-shrink-0';
                    targetText.className = 'text-on-surface';
                });
            });

            // Toggle switch mock
            const toggleBtn = document.querySelector('button[aria-pressed]');
            if(toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    const isPressed = this.getAttribute('aria-pressed') === 'true';
                    this.setAttribute('aria-pressed', !isPressed);
                    
                    if(!isPressed) {
                        this.className = 'w-[32px] h-[16px] bg-primary-container relative cursor-pointer focus:outline-none';
                        this.innerHTML = '<span class="absolute right-[2px] top-[2px] w-[12px] h-[12px] bg-surface"></span>';
                    } else {
                        this.className = 'w-[32px] h-[16px] bg-surface-variant border border-outline-variant relative cursor-pointer focus:outline-none';
                        this.innerHTML = '<span class="absolute left-[2px] top-[2px] w-[10px] h-[10px] bg-outline"></span>';
                    }
                });
            }
        });
    </script>
