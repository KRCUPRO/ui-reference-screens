<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fd; /* surface */
            color: #191c1f; /* on-surface */
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar JSON Blueprint Execution -->
<header class="bg-surface-container-lowest dark:bg-surface-container-lowest w-full h-12 border-b border-outline-variant flex justify-between items-center px-gutter transition-colors duration-200">
<div class="flex items-center space-x-4">
<span class="font-label-caps text-label-caps font-bold text-primary dark:text-primary-fixed">System Status: Active</span>
</div>
<div class="flex items-center space-x-4">
<!-- Search placeholder if on right -->
<div class="text-secondary opacity-60 font-body-md text-body-md">Search...</div>
<button class="font-label-caps text-label-caps px-component-padding-x py-component-padding-y border border-outline-variant hover:bg-surface-container-low transition-colors text-secondary dark:text-secondary-fixed-dim rounded">
                Emergency Revoke
            </button>
<button class="font-label-caps text-label-caps px-component-padding-x py-component-padding-y border border-primary text-primary bg-white hover:bg-primary-fixed transition-colors rounded">
                Create Key
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-[1440px] mx-auto px-container-margin py-8 md:py-12">
<!-- Section Header -->
<div class="mb-8 border-b border-outline-variant pb-2">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-1">Per-key usage comparison</h1>
</div>
<!-- Analytics Content Area -->
<div class="w-full flex flex-col gap-6">
<!-- Horizontal Bar Chart Module -->
<div class="w-full">
<div class="flex flex-col gap-4">
<!-- Row 1 -->
<div class="flex flex-col gap-1 w-full relative">
<div class="flex justify-between items-center">
<span class="font-data-mono text-data-mono text-on-surface-variant">prod-key-1</span>
<span class="font-data-mono text-data-mono text-on-surface">6,204 calls</span>
</div>
<div class="w-full h-6 bg-surface-container-high relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container" style="width: 100%;"></div>
</div>
</div>
<!-- Row 2 -->
<div class="flex flex-col gap-1 w-full relative">
<div class="flex justify-between items-center">
<span class="font-data-mono text-data-mono text-on-surface-variant">prod-key-2</span>
<span class="font-data-mono text-data-mono text-on-surface">4,880 calls</span>
</div>
<div class="w-full h-6 bg-surface-container-high relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container" style="width: 78.6%;"></div>
</div>
</div>
<!-- Row 3 -->
<div class="flex flex-col gap-1 w-full relative">
<div class="flex justify-between items-center">
<span class="font-data-mono text-data-mono text-on-surface-variant">backup-key</span>
<span class="font-data-mono text-data-mono text-on-surface">2,140 calls</span>
</div>
<div class="w-full h-6 bg-surface-container-high relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container" style="width: 34.5%;"></div>
</div>
</div>
<!-- Row 4 -->
<div class="flex flex-col gap-1 w-full relative">
<div class="flex justify-between items-center">
<span class="font-data-mono text-data-mono text-on-surface-variant">staging-key</span>
<span class="font-data-mono text-data-mono text-on-surface">316 calls</span>
</div>
<div class="w-full h-6 bg-surface-container-high relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary-container" style="width: 5.1%;"></div>
</div>
</div>
</div>
<!-- Caption -->
<div class="mt-4 border-t border-outline-variant pt-2">
<p class="font-label-caps text-label-caps text-secondary opacity-80">Last 30 days, sorted by volume</p>
</div>
</div>
</div>
</main>
