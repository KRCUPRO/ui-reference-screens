<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>High-Density Analytics - Success vs Failure by Key</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "surface-tint": "#4d44e3",
                "on-secondary-container": "#636262",

                "primary-fixed-dim": "#c3c0ff",

                "on-secondary-fixed": "#1c1b1b",
                "inverse-surface": "#2d3134",
                "surface-container-highest": "#e0e2e6",
                "primary-container": "#4f46e5",
                "primary": "#3525cd",
                "error-container": "#ffdad6",
                "tertiary": "#7e3000",
                "secondary": "#5f5e5e",
                "outline": "#777587",
                "on-tertiary-fixed-variant": "#7b2f00",
                "on-secondary-fixed-variant": "#474746",
                "surface-container": "#eceef2",
                "tertiary-container": "#a44100",
                "on-tertiary": "#ffffff",
                "on-tertiary-container": "#ffd2be",
                "secondary-fixed": "#e5e2e1",
                "surface": "#f7f9fd",
                "on-background": "#191c1f",
                "background": "#f7f9fd",
                "surface-container-low": "#f2f4f8",
                "on-tertiary-fixed": "#351000",
                "on-primary": "#ffffff",
                "surface-dim": "#d8dade",
                "inverse-on-surface": "#eff1f5",
                "surface-container-lowest": "#ffffff",
                "surface-container-high": "#e6e8ec",
                "on-primary-fixed": "#0f0069",
                "surface-bright": "#f7f9fd",
                "on-primary-fixed-variant": "#3323cc",
                "on-surface": "#191c1f",
                "tertiary-fixed": "#ffdbcc",
                "on-error": "#ffffff",
                "surface-variant": "#e0e2e6",
                "primary-fixed": "#e2dfff",
                "secondary-container": "#e2dfde"
              },
              "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
              },
              "spacing": {
                "unit": "4px",
                "container-margin": "32px",
                "component-padding-y": "8px",
                "gutter": "16px",
                "component-padding-x": "12px"
              },
              "fontFamily": {
                "headline-sm": [
                  "Inter"
                ],
                "headline-sm-mobile": [
                  "Inter"
                ],
                "data-mono-bold": [
                  "JetBrains Mono"
                ],
                "body-md": [
                  "Inter"
                ],
                "display-metric": [
                  "Inter"
                ],
                "label-caps": [
                  "Inter"
                ],
                "data-mono": [
                  "JetBrains Mono"
                ]
              },
              "fontSize": {
                "headline-sm": [
                  "18px",

                  "13px",

              }

          }

    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased h-screen overflow-hidden flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest w-full h-12 border-b border-outline-variant flex justify-between items-center px-gutter shrink-0">
<div class="flex items-center space-x-4">
<span class="font-label-caps text-label-caps font-bold text-primary">KeyOps Console</span>
<span class="font-label-caps text-label-caps text-on-surface-variant border-l border-outline-variant pl-4">System Status: Active</span>
</div>
<div class="flex items-center space-x-gutter">
<button class="font-label-caps text-label-caps text-on-surface border border-outline-variant px-component-padding-x py-component-padding-y bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
                Emergency Revoke
            </button>
<button class="font-label-caps text-label-caps text-primary border border-primary px-component-padding-x py-component-padding-y bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200">
                Create Key
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full flex justify-center p-container-margin overflow-y-auto">
<div class="w-full max-w-[1440px] flex flex-col">
<div class="mb-gutter flex justify-between items-baseline border-b border-outline-variant pb-component-padding-y">
<h1 class="font-headline-sm text-headline-sm text-on-surface">Success vs failure by key</h1>
</div>
<!-- Dense Data Table -->
<div class="w-full border border-outline-variant bg-surface-container-lowest">
<!-- Table Header -->
<div class="grid grid-cols-[200px_1fr_150px] gap-gutter px-component-padding-x py-component-padding-y border-b border-outline-variant bg-surface-container-lowest">
<div class="font-label-caps text-label-caps text-secondary text-left">Key Identifier</div>
<div class="font-label-caps text-label-caps text-secondary text-left">Distribution (Success / Failure)</div>
<div class="font-label-caps text-label-caps text-secondary text-right">Ratio</div>
</div>
<!-- Rows -->
<div class="flex flex-col">
<!-- Row 1: prod-key-1 -->
<div class="grid grid-cols-[200px_1fr_150px] gap-gutter px-component-padding-x py-component-padding-y border-b border-outline-variant items-center min-h-[32px]">
<div class="font-data-mono text-data-mono text-on-surface truncate">prod-key-1</div>
<div class="flex w-full h-[8px] overflow-hidden bg-error-container">
<div class="h-full bg-primary" style="width: 94.1%;"></div>
<div class="h-full bg-error" style="width: 5.9%;"></div>
</div>
<div class="font-data-mono-bold text-data-mono-bold text-on-surface text-right whitespace-nowrap">
<span class="text-primary">94.1%</span> <span class="text-secondary mx-1">/</span> <span class="text-error">5.9%</span>
</div>
</div>
<!-- Row 2: prod-key-2 -->
<div class="grid grid-cols-[200px_1fr_150px] gap-gutter px-component-padding-x py-component-padding-y border-b border-outline-variant items-center min-h-[32px]">
<div class="font-data-mono text-data-mono text-on-surface truncate">prod-key-2</div>
<div class="flex w-full h-[8px] overflow-hidden bg-error-container">
<div class="h-full bg-primary" style="width: 88.5%;"></div>
<div class="h-full bg-error" style="width: 11.5%;"></div>
</div>
<div class="font-data-mono-bold text-data-mono-bold text-on-surface text-right whitespace-nowrap">
<span class="text-primary">88.5%</span> <span class="text-secondary mx-1">/</span> <span class="text-error">11.5%</span>
</div>
</div>
<!-- Row 3: backup-key -->
<div class="grid grid-cols-[200px_1fr_150px] gap-gutter px-component-padding-x py-component-padding-y border-b border-outline-variant items-center min-h-[32px]">
<div class="font-data-mono text-data-mono text-on-surface truncate">backup-key</div>
<div class="flex w-full h-[8px] overflow-hidden bg-error-container">
<div class="h-full bg-primary" style="width: 99.2%;"></div>
<div class="h-full bg-error" style="width: 0.8%;"></div>
</div>
<div class="font-data-mono-bold text-data-mono-bold text-on-surface text-right whitespace-nowrap">
<span class="text-primary">99.2%</span> <span class="text-secondary mx-1">/</span> <span class="text-error">0.8%</span>
</div>
</div>
<!-- Row 4: staging-key -->
<div class="grid grid-cols-[200px_1fr_150px] gap-gutter px-component-padding-x py-component-padding-y items-center min-h-[32px]">
<div class="font-data-mono text-data-mono text-on-surface truncate">staging-key</div>
<div class="flex w-full h-[8px] overflow-hidden bg-error-container">
<div class="h-full bg-primary" style="width: 62.4%;"></div>
<div class="h-full bg-error" style="width: 37.6%;"></div>
</div>
<div class="font-data-mono-bold text-data-mono-bold text-on-surface text-right whitespace-nowrap">
<span class="text-primary">62.4%</span> <span class="text-secondary mx-1">/</span> <span class="text-error">37.6%</span>
</div>
</div>
</div>
</div>
<div class="mt-unit text-right">
<span class="font-label-caps text-label-caps text-secondary opacity-80">Last updated: Just now</span>
</div>
</div>
</main>
</body></html>
