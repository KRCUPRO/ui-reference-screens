<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center py-section-gap px-margin-safe">
<!-- Marketing Section Container -->
<section class="w-full max-w-4xl mx-auto flex flex-col gap-stack-lg">
<!-- Heading -->
<header class="text-center w-full">
<h2 class="font-display-lg text-display-lg text-primary tracking-tight">Index what you already store</h2>
</header>
<!-- Two Column Panel -->
<div class="flex flex-col md:flex-row w-full border-t border-b border-surface-variant relative py-stack-lg">
<!-- Divider (Desktop) -->
<div class="hidden md:block absolute left-1/2 top-0 bottom-0 w-px bg-surface-variant transform -translate-x-1/2"></div>
<!-- Divider (Mobile) -->
<div class="md:hidden w-full h-px bg-surface-variant my-stack-md"></div>
<!-- Left Column: Folder Tree -->
<div class="flex-1 flex flex-col gap-stack-md md:pr-gutter relative z-10 bg-surface">
<ul class="flex flex-col gap-stack-sm">
<!-- Folder Item 1 -->
<li class="flex items-center justify-between group hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-DEFAULT -mx-2 cursor-pointer">
<div class="flex items-center gap-stack-sm">
<input class="w-4 h-4 rounded-DEFAULT border-outline text-primary focus:ring-primary bg-surface-container-lowest transition-all" type="checkbox"/>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0, 'wght' 300;">folder</span>
<span class="font-ui-medium text-ui-medium text-on-surface group-hover:text-primary transition-colors">Contracts</span>
</div>
<span class="font-caption text-caption text-secondary">128 files</span>
</li>
<!-- Folder Item 2 -->
<li class="flex items-center justify-between group hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-DEFAULT -mx-2 cursor-pointer">
<div class="flex items-center gap-stack-sm">
<input class="w-4 h-4 rounded-DEFAULT border-outline text-primary focus:ring-primary bg-surface-container-lowest transition-all" type="checkbox"/>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0, 'wght' 300;">folder</span>
<span class="font-ui-medium text-ui-medium text-on-surface group-hover:text-primary transition-colors">Board Decks</span>
</div>
<span class="font-caption text-caption text-secondary">42 files</span>
</li>
<!-- Folder Item 3 -->
<li class="flex items-center justify-between group hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-DEFAULT -mx-2 cursor-pointer">
<div class="flex items-center gap-stack-sm">
<input class="w-4 h-4 rounded-DEFAULT border-outline text-primary focus:ring-primary bg-surface-container-lowest transition-all" type="checkbox"/>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0, 'wght' 300;">folder</span>
<span class="font-ui-medium text-ui-medium text-on-surface group-hover:text-primary transition-colors">Research Notes</span>
</div>
<span class="font-caption text-caption text-secondary">1,024 files</span>
</li>
</ul>
</div>
<!-- Right Column: Cloud Connectors -->
<div class="flex-1 flex flex-col gap-stack-md md:pl-gutter relative z-10 bg-surface">
<ul class="flex flex-col gap-stack-sm">
<!-- Connector Item 1 -->
<li class="flex items-center justify-between p-2 rounded-DEFAULT border border-transparent hover:border-surface-variant transition-colors duration-200 -mx-2">
<div class="flex items-center gap-stack-sm">
<div class="w-8 h-8 rounded-DEFAULT bg-surface-container-low flex items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">cloud</span>
</div>
<span class="font-ui-medium text-ui-medium text-on-surface">Google Drive</span>
</div>
<button class="px-4 py-1 border border-primary text-primary font-label-bold text-label-bold rounded-DEFAULT hover:bg-primary hover:text-on-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
              Connect
            </button>
</li>
<!-- Connector Item 2 -->
<li class="flex items-center justify-between p-2 rounded-DEFAULT border border-transparent hover:border-surface-variant transition-colors duration-200 -mx-2">
<div class="flex items-center gap-stack-sm">
<div class="w-8 h-8 rounded-DEFAULT bg-surface-container-low flex items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">description</span>
</div>
<span class="font-ui-medium text-ui-medium text-on-surface">Notion</span>
</div>
<button class="px-4 py-1 border border-primary text-primary font-label-bold text-label-bold rounded-DEFAULT hover:bg-primary hover:text-on-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
              Connect
            </button>
</li>
<!-- Connector Item 3 -->
<li class="flex items-center justify-between p-2 rounded-DEFAULT border border-transparent hover:border-surface-variant transition-colors duration-200 -mx-2">
<div class="flex items-center gap-stack-sm">
<div class="w-8 h-8 rounded-DEFAULT bg-surface-container-low flex items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 0, 'wght' 300;">inventory_2</span>
</div>
<span class="font-ui-medium text-ui-medium text-on-surface">Dropbox</span>
</div>
<button class="px-4 py-1 border border-primary text-primary font-label-bold text-label-bold rounded-DEFAULT hover:bg-primary hover:text-on-primary transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
              Connect
            </button>
</li>
</ul>
</div>
</div>
