<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Slate Console - Version History Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#271901",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary-fixed-dim": "#bec6e0",
                        "on-tertiary-fixed-variant": "#574425",
                        "on-primary": "#ffffff",
                        "surface-tint": "#565e74",
                        "on-secondary-fixed": "#0d1c2f",
                        "inverse-surface": "#213145",
                        "on-primary-container": "#7c839b",
                        "secondary-container": "#d5e3fd",
                        "tertiary-fixed-dim": "#dec29a",
                        "error": "#ba1a1a",
                        "on-background": "#0b1c30",
                        "on-tertiary-container": "#98805d",
                        "primary": "#000000",
                        "inverse-primary": "#bec6e0",
                        "surface-dim": "#cbdbf5",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-secondary-fixed-variant": "#3a485c",
                        "error-container": "#ffdad6",
                        "background": "#f8f9ff",
                        "surface-variant": "#d3e4fe",
                        "surface-container-highest": "#d3e4fe",
                        "on-surface": "#0b1c30",
                        "tertiary-fixed": "#fcdeb5",
                        "on-primary-fixed": "#131b2e",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e5eeff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#271901",
                        "secondary-fixed": "#d5e3fd",
                        "tertiary": "#000000",
                        "outline-variant": "#c6c6cd",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#131b2e",
                        "outline": "#76777d",
                        "surface-container-high": "#dce9ff",
                        "surface": "#f8f9ff",
                        "secondary": "#515f74",
                        "on-secondary-container": "#57657b",
                        "primary-fixed": "#dae2fd",
                        "surface-bright": "#f8f9ff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface-variant": "#45464d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "unit": "4px",
                        "margin": "24px",
                        "gutter": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "mono-code": ["JetBrains Mono"],
                        "body-sm": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "mono-label": ["JetBrains Mono"],
                        "label-caps": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "mono-code": ["13px", { "lineHeight": "20px", "fontWeight": "450" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "mono-label": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-lg">
<!-- Modal Overlay Backdrop (Implied) -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-40"></div>
<!-- Detail Modal Container -->
<div class="relative z-50 w-full max-w-3xl bg-surface-container-lowest border border-outline-variant shadow-sm rounded flex flex-col h-[600px] overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant bg-surface">
<h2 class="font-headline-sm text-headline-sm text-primary">Metadata</h2>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Tab Bar -->
<div class="flex px-lg border-b border-outline-variant bg-surface-bright">
<button class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors border-b-2 border-transparent">
                PREVIEW
            </button>
<button class="px-md py-sm font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors border-b-2 border-transparent">
                CODE
            </button>
<button class="px-md py-sm font-label-caps text-label-caps text-primary border-b-2 border-primary">
                HISTORY
            </button>
</div>
<!-- History Panel Content Canvas -->
<div class="flex-1 bg-surface-bright p-lg overflow-y-auto flex flex-col gap-lg">
<!-- Initial Version Row -->
<div class="flex items-center gap-sm px-md py-sm border border-outline-variant rounded bg-surface-container-lowest">
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
<div class="flex-1 font-mono-code text-mono-code text-on-surface-variant flex items-center gap-sm flex-wrap">
<span class="font-bold text-primary">v1</span>
<span class="text-outline-variant">•</span>
<span>first generation</span>
<span class="text-outline-variant">•</span>
<span>Sep 3, 2026</span>
<span class="text-outline-variant">•</span>
<span>14:22</span>
<span class="text-outline-variant">•</span>
<span class="text-secondary bg-surface-variant px-xs rounded">key-warm-7</span>
</div>
</div>
<!-- Empty State / Note -->
<div class="flex flex-col items-center justify-center flex-1 py-xl border border-dashed border-outline-variant/50 rounded bg-surface-container-lowest/50 gap-md">
<p class="font-body-sm text-body-sm text-outline text-center max-w-sm">
                    Regenerate this screen to start building a version history.
                </p>
<button class="px-gutter py-sm border border-outline-variant text-outline rounded font-label-caps text-label-caps opacity-50 cursor-not-allowed flex items-center gap-xs" disabled="">
<span class="material-symbols-outlined text-[16px]" data-icon="refresh">refresh</span>
                    REGENERATE
                </button>
</div>
<!-- Intentionally left blank below to match "airy, minimalist feel" prompt requirement -->
</div>
</div>
</body></html>
