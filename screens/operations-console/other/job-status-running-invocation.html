<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Job Status</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary-container": "#00f0ff",
              "on-secondary-container": "#520049",
              "surface-container": "#201f1f",
              "error-container": "#93000a",
              "background": "#131313",
              "surface-container-low": "#1c1b1b",
              "secondary-fixed-dim": "#fface8",
              "on-tertiary-fixed-variant": "#374e00",
              "tertiary-fixed-dim": "#a0d800",
              "outline-variant": "#3b494b",
              "on-tertiary-fixed": "#141f00",
              "surface-tint": "#00dbe9",
              "primary": "#dbfcff",
              "on-primary-fixed-variant": "#004f54",
              "on-tertiary": "#253600",
              "primary-fixed-dim": "#00dbe9",
              "on-primary-fixed": "#002022",
              "on-primary": "#00363a",
              "inverse-surface": "#e5e2e1",
              "surface-variant": "#353534",
              "secondary-container": "#ff24e4",
              "primary-fixed": "#7df4ff",
              "inverse-primary": "#006970",
              "on-tertiary-container": "#4b6800",
              "on-secondary-fixed": "#3a0033",
              "on-secondary": "#5e0053",
              "surface-container-high": "#2a2a2a",
              "secondary": "#fface8",
              "on-surface-variant": "#b9cacb",
              "on-background": "#e5e2e1",
              "on-primary-container": "#006970",
              "tertiary-container": "#afed00",
              "surface": "#131313",
              "on-surface": "#e5e2e1",
              "inverse-on-surface": "#313030",
              "surface-bright": "#3a3939",
              "on-secondary-fixed-variant": "#840076",
              "surface-dim": "#131313",
              "surface-container-highest": "#353534",
              "secondary-fixed": "#ffd7f0",
              "error": "#ffb4ab",
              "tertiary": "#e8ffb6",
              "surface-container-lowest": "#0e0e0e",
              "outline": "#849495",
              "on-error-container": "#ffdad6",
              "tertiary-fixed": "#b7f700",
              "on-error": "#690005"
            },
            "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
            },
            "spacing": {
              "container-max": "1440px",
              "margin": "24px",
              "gutter": "16px",
              "unit": "4px"
            },
            "fontFamily": {
              "headline-lg": ["Space Grotesk"],
              "label-sm": ["JetBrains Mono"],
              "headline-xl": ["Space Grotesk"],
              "body-md": ["Geist"],
              "headline-lg-mobile": ["Space Grotesk"],
              "code-md": ["JetBrains Mono"]
            },
            "fontSize": {
              "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
              "label-sm": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
              "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],

          },
        },
      }

<style>
        body {
            /* Fallback font if requested fonts fail to load */
            font-family: 'Geist', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom glow for the active progress ring */
        .glow-ring {
            filter: drop-shadow(0 0 12px theme('colors.primary-fixed'));
        }
        
        /* Custom animation for the blinking cursor effect in the timer */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-blink {
            animation: blink 1s step-end infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface h-screen w-screen flex flex-col justify-between p-margin font-body-md overflow-hidden max-w-[480px] mx-auto border-x border-outline-variant/30">
<!-- Top Section: Status Header -->
<header class="w-full flex justify-center items-center pt-unit">
<div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
            Job #4822 • Started 09:14
        </div>
</header>
<!-- Middle Section: Hero Progress & Action Details -->
<main class="flex-1 flex flex-col items-center justify-center -mt-12">
<!-- Hero: Circular Progress Ring -->
<div class="relative w-64 h-64 mb-8 flex items-center justify-center">
<!-- SVG Background Ring -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 256 256">
<!-- Track -->
<circle cx="128" cy="128" fill="none" r="120" stroke="theme('colors.surface-container-high')" stroke-width="4"></circle>
<!-- Progress Indicator (60% filled) 
                     Circumference = 2 * PI * 120 ≈ 754 
                     60% of 754 ≈ 452.4
                     Dashoffset = 754 - 452.4 ≈ 301.6
                -->
<circle class="glow-ring transition-all duration-1000 ease-out" cx="128" cy="128" fill="none" r="120" stroke="theme('colors.primary-fixed')" stroke-dasharray="754" stroke-dashoffset="302" stroke-linecap="square" stroke-width="4"></circle>
</svg>
<!-- Centered Text inside ring -->
<div class="font-headline-xl text-headline-xl text-primary drop-shadow-[0_0_8px_theme(colors.primary-fixed)]">
                60%
            </div>
</div>
<!-- Action Details -->
<div class="text-center flex flex-col gap-3">
<div class="font-body-md text-body-md text-on-surface-variant">
                Invoking <span class="font-code-md text-code-md text-on-surface bg-surface-container-high px-2 py-1 border border-outline-variant/50 rounded-DEFAULT">rotate_key</span>
</div>
<div class="flex items-center justify-center font-code-md text-code-md text-primary-fixed drop-shadow-[0_0_4px_theme(colors.primary-fixed)] text-lg">
<span class="material-symbols-outlined mr-2 text-sm">schedule</span>
                00:07<span class="w-2 h-4 bg-primary-fixed ml-1 inline-block animate-blink align-middle"></span>
</div>
</div>
</main>
<!-- Bottom Section: Primary Action -->
<footer class="w-full pb-unit">
<button class="w-full h-14 border border-error text-error font-label-sm text-label-sm uppercase tracking-widest hover:bg-error hover:text-on-error hover:shadow-[0_0_16px_theme(colors.error)] transition-all duration-300 ease-out flex items-center justify-center gap-2 rounded-DEFAULT active:scale-[0.98]">
<span class="material-symbols-outlined text-lg" data-weight="fill">close</span>
            Cancel Task
        </button>
</footer>
</body></html>
