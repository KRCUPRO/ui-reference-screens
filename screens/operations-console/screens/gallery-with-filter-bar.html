<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Design Gallery</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

      tailwind.config = {
        darkMode: "class",

            "colors": {

              "on-tertiary-container": "#696360",
              "on-surface-variant": "#c4c7c8",

<style>
        body {
            background-color: #121414; /* background */
            color: #e3e2e2; /* on-background */
        }
        
        .divider-bottom {
            border-bottom: 1px solid #262626; /* Ink-faint rule-strong */
        }
        
        .divider-right {
            border-right: 1px solid #262626;
        }

        .border-ink-faint {
            border: 1px solid #262626;
        }
        
        /* Custom scrollbar for gallery */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121414;
        }
        ::-webkit-scrollbar-thumb {
            background: #343535;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444748;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopAppBar -->
<header class="flex justify-between items-center h-[64px] px-margin-desktop bg-surface divider-bottom sticky top-0 z-50">
<div class="flex items-center gap-md">
<span class="font-headline-md text-headline-md font-bold text-primary">Console</span>
<div class="h-6 divider-right mx-sm"></div>
<span class="font-body-md text-body-md text-on-surface-variant">Design Gallery</span>
</div>
<div class="flex items-center gap-md text-on-surface-variant">
<button class="hover:text-primary transition-colors flex items-center justify-center w-8 h-8">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="hover:text-primary transition-colors flex items-center justify-center w-8 h-8">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-high border-ink-faint overflow-hidden ml-sm">
<img alt="User profile" class="w-full h-full object-cover" data-alt="A macro photography shot of an abstract metallic surface with subtle iridescent lighting, serving as a sleek, modern avatar placeholder in a dark mode UI. Deep blacks and vibrant structural colors." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDd1eOKNsjK-cnaGCvsOXXhDTXHLcjxL460gA6sApeZY6XJh_RyopDo2zsZ3_zDKr2SjSx-s-qUIUHlOHQS3gTfnTmzW4W4EiqIRrfm78R65xhJWhs2xHf2S1UBboVwegDjwoaKYRBTef1Ur3Crdd3rMXcntxhBakS9sdFRg9uYW6ck3IpkP8Zll42xGx5a2q-4FU0eLFctVXSv8wr4KmMIndptXdG58OxWODD3zcpdms3J6zzYli0mLeFWe7L9b_dYOg8BB7a-Mdw"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col">
<!-- Filter Bar -->
<div class="w-full border-b border-[#262626] bg-surface z-40 sticky top-[64px]">
<div class="max-w-[1200px] mx-auto px-margin-desktop py-md flex flex-wrap lg:flex-nowrap items-center justify-between gap-4">
<!-- Controls Row -->
<div class="flex flex-wrap items-center gap-[12px] flex-1">
<!-- 1. Project Dropdown -->
<div class="relative group cursor-pointer">
<div class="flex items-center gap-xs px-md py-sm bg-surface-container border border-[#262626] rounded hover:border-outline-variant transition-colors">
<span class="font-body-md text-body-md text-primary whitespace-nowrap">All projects</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- 2. Device Segmented Control -->
<div class="flex items-center bg-surface-container border border-[#262626] rounded p-[2px]">
<button class="flex items-center gap-xs px-sm py-[6px] bg-[#262626] rounded-[2px] text-primary transition-colors">
<span class="font-label-mono text-label-mono">DESKTOP</span>
</button>
<button class="flex items-center justify-center px-sm py-[6px] text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">smartphone</span>
</button>
</div>
<!-- 3. Date Range Chip -->
<div class="flex items-center gap-xs px-md py-sm bg-surface-container border border-[#262626] rounded hover:border-outline-variant transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">calendar_today</span>
<span class="font-body-md text-body-md text-primary whitespace-nowrap">Last 30 days</span>
</div>
<!-- 4. Tag Multiselect Area -->
<div class="flex items-center gap-sm px-sm py-sm border border-[#262626] rounded bg-surface min-w-[200px] flex-1 lg:flex-none">
<div class="flex items-center gap-xs px-xs py-[2px] border border-[#262626] rounded-[2px]">
<span class="font-caption-mono text-caption-mono text-on-surface">hero</span>
<button class="flex items-center justify-center text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
</div>
<div class="flex items-center gap-xs px-xs py-[2px] border border-[#262626] rounded-[2px]">
<span class="font-caption-mono text-caption-mono text-on-surface">pricing</span>
<button class="flex items-center justify-center text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
</div>
<div class="flex items-center gap-xs px-xs py-[2px] border border-[#262626] rounded-[2px]">
<span class="font-caption-mono text-caption-mono text-on-surface">empty-state</span>
<button class="flex items-center justify-center text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined text-[12px]">close</span>
</button>
</div>
</div>
<!-- 5. Search Input -->
<div class="flex items-center gap-xs px-md py-sm bg-surface-container border border-[#262626] rounded focus-within:border-primary transition-colors flex-1 lg:max-w-[240px]">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">search</span>
<input class="bg-transparent border-none p-0 m-0 font-label-mono text-label-mono text-primary placeholder-on-surface-variant focus:ring-0 w-full outline-none" placeholder="Search screens" type="text"/>
</div>
</div>
<!-- Right Side Info & Actions -->
<div class="flex items-center gap-md shrink-0">
<span class="font-caption-mono text-caption-mono text-on-surface-variant">38 results</span>
<button class="font-label-mono text-label-mono text-primary hover:text-inverse-surface transition-colors uppercase underline decoration-[#262626] underline-offset-4">
                        Clear all
                    </button>
</div>
</div>
</div>
<!-- Gallery Grid (Glimpse) -->
<div class="flex-1 bg-background">
<div class="max-w-[1200px] mx-auto px-margin-desktop py-xl">
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Card 1 -->
<div class="border border-[#262626] bg-surface flex flex-col group cursor-pointer hover:border-outline-variant transition-colors">
<div class="aspect-video w-full bg-surface-container-low overflow-hidden border-b border-[#262626] relative">
<div class="absolute inset-0 flex items-center justify-center text-on-surface-variant group-hover:scale-105 transition-transform duration-500">
<img alt="Design preview" class="w-full h-full object-cover" data-alt="A minimalist UI dashboard wireframe featuring high contrast dark mode aesthetic. Sharp geometric shapes, thin 1px dividing lines, and precise typography structure. The scene is illuminated by harsh, cold technical lighting emphasizing clarity over decoration." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfpVNSYP7qqltfJvGLPZRFgJ-EV7jSDu4PbYRoM62zG-DLno2fr4Mb_W2cslJxRiS1J4wD3mtD6cSUowGWD_rbxlMLP3Oj_wt1rFsB6gUaJUqLIJdrFlTuhiJpxj8P9S02Z9PYP_EpLeFmIUgPhe-ZEpEgzH-RtdYXLR7723RYXYQTDKbfX1QuVYYYuDCElwgKtQ4ethkcHz7kZGoJx7ktEPWX_A0eNFoUoxW-_chvWAxYnpoYeZKJEC6bVrNZ1cSdU2gpnLH0bps"/>
</div>
</div>
<div class="p-md flex justify-between items-start">
<div>
<h3 class="font-body-lg text-body-lg text-primary mb-xs">Dashboard Hero V2</h3>
<p class="font-caption-mono text-caption-mono text-on-surface-variant">Console Alpha / Web</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
<!-- Card 2 -->
<div class="border border-[#262626] bg-surface flex flex-col group cursor-pointer hover:border-outline-variant transition-colors">
<div class="aspect-video w-full bg-surface-container-low overflow-hidden border-b border-[#262626] relative">
<div class="absolute inset-0 flex items-center justify-center text-on-surface-variant group-hover:scale-105 transition-transform duration-500">
<img alt="Design preview" class="w-full h-full object-cover" data-alt="A modern dark mode pricing table design showcasing three distinct tiers. Deep black background with pristine white text and sharp 1px gray borders dividing the columns. Utilitarian, developer-focused visual style with no decorative gradients." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0A5LGI5E0uh-zSsiHxBoOGjl3o_-KiVMgs-N2ca-hm9K00icFu5RreOjnHm5D-bNlTn8t8b7kcSoO0opB44tjZOREGn9HVzXdyKBX9QsgtCPO2hoSSKiopFbg5jAFbzyvE99FptpezI4S4lIviXTjqe1fl0cnZl5_5722aDXw-HUxH65IHhFmsnSEBmXlh6u56QR0PbhX1z9SPIXdRJZGJWPN7S65onK_11qJgbzem9HVMk8o0iPM9AcFBaE1v6njOrmMvUQNVs8"/>
</div>
</div>
<div class="p-md flex justify-between items-start">
<div>
<h3 class="font-body-lg text-body-lg text-primary mb-xs">Pro Tier Pricing</h3>
<p class="font-caption-mono text-caption-mono text-on-surface-variant">Marketing / Web</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
<!-- Card 3 -->
<div class="border border-[#262626] bg-surface flex flex-col group cursor-pointer hover:border-outline-variant transition-colors">
<div class="aspect-video w-full bg-surface-container-low overflow-hidden border-b border-[#262626] relative">
<div class="absolute inset-0 flex items-center justify-center text-on-surface-variant group-hover:scale-105 transition-transform duration-500">
<img alt="Design preview" class="w-full h-full object-cover" data-alt="An austere dark mode empty state screen design. A central stark geometric icon sits above precisely set mono-spaced text. The environment is pure black, utilizing only white text and faint grey structural lines to guide the eye." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB3aUTxCe8jSicrxp98wV_LWcsskzq0lLOwMOHci06V6JenohbF-GhDGFq6cxg9UlrisbzIEdG831geu_p8gwXSqoosYJSXzXqP_huOBnFV9--3rIlUETLHpI6rKB0wZ13p5eYmGCXYKhO6b_SqGZQ5gJXTYqzXfw7VzhRZWMAyQt9eaGvpcGwSOxl7XUOIZXq0Y32t7EDzuiLaVkSQrsKBDiWx660g4ifNvtZT1n9GxBkMDVdFowGYsL-XRs1GZzbXZd4Fpzp-ok"/>
</div>
</div>
<div class="p-md flex justify-between items-start">
<div>
<h3 class="font-body-lg text-body-lg text-primary mb-xs">Zero Data State</h3>
<p class="font-caption-mono text-caption-mono text-on-surface-variant">Analytics / Mobile</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">more_vert</span>
</button>
</div>
</div>
</div>
</div>
</div>
</main>
</body></html>
