<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-slate-border text-primary dark:text-primary-fixed-dim docked full-width top-0 flex items-center w-full px-4 h-16 shrink-0 z-40 transition-colors duration-200">
<button aria-label="Menu" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-highest dark:hover:bg-surface-container-highest focus:outline-none focus:ring-2 focus:ring-tertiary transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="menu">menu</span>
</button>
<h1 class="ml-4 font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim truncate">Overview</h1>
<div class="flex-grow"></div>
</header>
<!-- Alert Banner -->
<div class="bg-error-container text-on-error-container w-full px-4 py-3 flex items-center justify-between border-b border-error/20 shrink-0 z-30">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 bg-error rounded-sm flex-shrink-0 border border-error/50"></div>
<p class="font-status-code text-status-code text-on-error-container break-all">Cannot reach gateway at localhost:8787</p>
</div>
<button class="font-label-md text-label-md text-error hover:text-on-error-container transition-colors ml-4 shrink-0 whitespace-nowrap focus:outline-none focus:underline uppercase tracking-wider font-bold" type="button">Retry</button>
</div>
<!-- Main Content Area - Empty State -->
<main class="flex-grow flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle background pattern for technical feel -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, currentColor 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="z-10 flex flex-col items-center text-center max-w-sm w-full bg-slate-surface border border-slate-border rounded p-8 shadow-sm">
<span class="material-symbols-outlined text-4xl text-on-surface-variant/50 mb-6" data-icon="cloud_off" style="font-variation-settings: 'FILL' 0, 'wght' 200;">cloud_off</span>
<h2 class="font-status-code text-status-code text-on-surface mb-3 flex items-center justify-center">
<span class="w-2 h-2 bg-on-surface-variant/30 rounded-full mr-2"></span>
                Offline since 14:47:02
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 leading-relaxed">
                The console will reconnect automatically every 10 seconds.
            </p>
<div class="mt-8 flex items-center gap-xs">
<div class="w-1.5 h-1.5 rounded-full bg-tertiary/20 animate-pulse delay-75"></div>
<div class="w-1.5 h-1.5 rounded-full bg-tertiary/40 animate-pulse delay-150"></div>
<div class="w-1.5 h-1.5 rounded-full bg-tertiary/60 animate-pulse delay-300"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
