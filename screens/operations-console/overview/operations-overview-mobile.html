<style>
      body {
        background-color: #FDFCF8; /* paper-bg fallback */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .hide-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-paper-bg text-on-background font-body-md min-h-screen flex flex-col md:max-w-md md:mx-auto md:border-x md:border-ui-border">
<!-- TopAppBar from JSON -->
<header class="flex justify-between items-center w-full px-margin-mobile h-14 sticky top-0 z-50 bg-paper-bg border-b border-ui-border transition-colors duration-150 ease-in-out">
<button class="text-on-surface-variant hover:bg-surface-container rounded-DEFAULT p-2 transition-colors duration-150 ease-in-out flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</button>
<h1 class="font-label-caps text-label-caps text-ink-black tracking-widest uppercase">OPS CONSOLE</h1>
<button class="text-on-surface-variant hover:bg-surface-container rounded-DEFAULT p-2 transition-colors duration-150 ease-in-out flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col gap-stack-lg pb-24">
<!-- Service Toggle Card -->
<section class="bg-surface-container-lowest border border-ui-border rounded-none shadow-[0px_2px_8px_rgba(0,0,0,0.05)] p-stack-md flex justify-between items-center">
<div class="flex flex-col gap-base">
<span class="font-label-caps text-label-caps text-on-surface-variant">STATUS</span>
<div class="flex items-center gap-2">
<div class="w-3 h-3 bg-status-active"></div>
<span class="font-title-md text-title-md text-ink-black">Service Running</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-status-active appearance-none cursor-pointer transition-transform duration-200 ease-in-out translate-x-6 z-10" id="toggle1" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-status-active cursor-pointer" for="toggle1"></label>
</div>
<style>
                .toggle-checkbox:checked {
                    right: 0;
                    border-color: #22C55E;
                }
                .toggle-checkbox:checked + .toggle-label {
                    background-color: #22C55E;
                }
                .toggle-checkbox {
                    border-color: #e3e2df;
                }
                .toggle-label {
                    background-color: #e3e2df;
                }
            </style>
</section>
<!-- Key Grid -->
<section>
<h2 class="font-label-caps text-label-caps text-on-surface-variant mb-stack-sm">API KEYS</h2>
<div class="grid grid-cols-2 gap-stack-sm">
<!-- Key Card 1 -->
<div class="bg-surface-container-lowest border border-ui-border p-stack-sm flex flex-col gap-base rounded-none">
<div class="flex justify-between items-center w-full">
<span class="font-data-sm text-data-sm text-ink-black">prod-1</span>
<div class="w-2 h-2 bg-status-active rounded-full"></div>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">99.9% up</span>
</div>
<!-- Key Card 2 -->
<div class="bg-surface-container-lowest border border-ui-border p-stack-sm flex flex-col gap-base rounded-none">
<div class="flex justify-between items-center w-full">
<span class="font-data-sm text-data-sm text-ink-black">prod-2</span>
<div class="w-2 h-2 bg-status-active rounded-full"></div>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">99.8% up</span>
</div>
<!-- Key Card 3 -->
<div class="bg-surface-container-lowest border border-ui-border p-stack-sm flex flex-col gap-base rounded-none">
<div class="flex justify-between items-center w-full">
<span class="font-data-sm text-data-sm text-ink-black">backup</span>
<div class="w-2 h-2 bg-status-active rounded-full"></div>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">100% up</span>
</div>
<!-- Key Card 4 -->
<div class="bg-surface-container-lowest border border-ui-border p-stack-sm flex flex-col gap-base rounded-none">
<div class="flex justify-between items-center w-full">
<span class="font-data-sm text-data-sm text-ink-black">staging</span>
<div class="w-2 h-2 bg-surface-variant rounded-full"></div>
</div>
<span class="font-data-sm text-data-sm text-on-surface-variant">idle</span>
</div>
</div>
</section>
<!-- Today Stat -->
<section class="bg-surface-container-lowest border border-ui-border rounded-none shadow-[0px_2px_8px_rgba(0,0,0,0.05)] p-stack-md flex flex-col gap-stack-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant">TODAY'S VOLUME</span>
<div class="font-data-lg text-data-lg text-ink-black flex flex-col">
<span class="text-[32px] leading-[40px] font-bold">1,102 calls</span>
<span class="text-status-active">95.4% success</span>
</div>
</section>
<!-- Recent Screens Carousel -->
<section class="flex flex-col gap-stack-sm">
<h2 class="font-label-caps text-label-caps text-on-surface-variant">RECENT VIEWS</h2>
<div class="flex overflow-x-auto hide-scrollbar gap-stack-sm pb-2 -mx-margin-mobile px-margin-mobile">
<div class="min-w-[140px] h-24 bg-surface-container border border-ui-border flex items-center justify-center rounded-none relative group overflow-hidden cursor-pointer" data-alt="A detailed digital interface mockup of a data dashboard on a modern minimalist tablet. The screen displays complex line graphs and bar charts in a stark monochrome palette with sudden accents of bright green. The lighting is even and flat, typical of a professional light-mode software application environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCMiU6M4ALZowFkgQ9ZrwelZIB-GgEcaE2JmrR1sXoe5_zIbZCwTESRen3bNFFEPlUAL86uHDhLaIXH84XcC3YE07N0fLPD0BPqheXVdAdhqus2CDjH4RoONsOVfxL4kcVp092XVfXr-3nozofY1WM_UegAk-lxBy1NUKSiJbmd1DFp-S3SBrNyGwLukwyRLyrWvTdipsweDR68JrUGR2G6k0OU18M1qViCXrm9b0sTWajbh-X0fOgtIBSCIJWEMCBELf_bAPP8tKIR')">
<div class="absolute inset-0 bg-ink-black/10 group-hover:bg-transparent transition-colors"></div>
<span class="bg-surface-container-lowest border border-ui-border px-2 py-1 font-label-caps text-label-caps absolute bottom-2 left-2 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">LATENCY</span>
</div>
<div class="min-w-[140px] h-24 bg-surface-container border border-ui-border flex items-center justify-center rounded-none relative group overflow-hidden cursor-pointer" data-alt="A stark, minimalist view of a server error log interface. Rows of terminal-like monospaced text fill a stark white screen, punctuated by rare red error highlights. The aesthetic is purely functional, reflecting a professional technical developer environment with crisp typography and high contrast." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBsH7cDwR8W8mZGREusTSlfAyi42Oa6CkXLNd1dHZdSYvtlwWMYwl1GZXg9X0Ipm5Oz8GAMN5TMvVHvWosaC54IHRypss4wQzKHSsV91Dl5Tw0VewcReM0TcIOVoNAx9KBJhk3Brk1qvWp3cm5mUIUZCQ0tXvhbnOoUsdvuZCA_hJg-E_hwLQbZqfYaRMMJxfxOjjVFmJKttoIH0R24h1jIglme0SYbX4ymbq-5Q0ZIYWvl9jtfNTb6mh3xoWcWbJCW52ovpQByN2y8')">
<div class="absolute inset-0 bg-ink-black/10 group-hover:bg-transparent transition-colors"></div>
<span class="bg-surface-container-lowest border border-ui-border px-2 py-1 font-label-caps text-label-caps absolute bottom-2 left-2 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">ERRORS</span>
</div>
<div class="min-w-[140px] h-24 bg-surface-container border border-ui-border flex items-center justify-center rounded-none relative group overflow-hidden cursor-pointer" data-alt="A clean, grid-based layout showing active user sessions on a world map wireframe. The aesthetic is light, airy, and professional, using a paper-white background with delicate grey grid lines and sharp geometric shapes representing data points." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC0g5ub-27InV_U6-LdGy1o9k0EdfF5dK5mdhlWhjuxRG73NiL4Tdvm8ZsuwAOnJGsAFE6g9hIIIyPF8EPFAF_uN0VbTCIM8WPEqLZJhw84TqF25byrQ2Lq64k_dZyfGeXeWmr1McEuMJCN5llFJrlKD1-9iE88K8dVnaIv7YbD_4b-gADFo8HvZMAi4SMezCdJcWqp88x4WNO9pmMxSUcitfoQVZ0KzF6gdwrq-KdY_h2FDk88t9hXeFlHxNexHL2yDHOAY4wyzRqV')">
<div class="absolute inset-0 bg-ink-black/10 group-hover:bg-transparent transition-colors"></div>
<span class="bg-surface-container-lowest border border-ui-border px-2 py-1 font-label-caps text-label-caps absolute bottom-2 left-2 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">USERS</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar / Quick Actions Override (Contextual specific to this intent) -->
<!-- Suppressing JSON BottomNavBar as per logic ("Automatic Suppression: Task-Focused... linear/transactional") and using the requested Quick Actions fixed bottom row -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-paper-bg border-t border-ui-border h-16 flex justify-around items-center px-gutter-mobile md:max-w-md md:left-1/2 md:-translate-x-1/2 md:border-x">
<button class="w-10 h-10 flex items-center justify-center rounded-none border border-ui-border text-ink-black hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="pause">pause</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-none bg-ink-black text-on-primary hover:bg-inverse-surface transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-none border border-ui-border text-ink-black hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-none border border-ui-border text-ink-black hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
</button>
</div>
</body></html>
