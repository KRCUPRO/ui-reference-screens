<style>
        .shimmer {
            position: relative;
            overflow: hidden;
            background-color: var(--surface-container-high, #e9e6fa); /* Fallback */
        }
        .shimmer::after {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
            content: '';
        }
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-surface-bg text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest border-b border-outline-variant w-full h-12 flex justify-between items-center px-gutter shrink-0">
<div class="flex items-center gap-gutter h-full">
<span class="font-label-caps text-label-caps font-bold text-primary">System Status: Active</span>
<nav class="hidden md:flex h-full">
<!-- Active Navigation: Overview -->
<a class="h-full flex items-center px-4 text-primary border-b-2 border-primary transition-colors duration-200 hover:bg-surface-container-low font-label-caps text-label-caps" href="#">
                    Overview
                </a>
<a class="h-full flex items-center px-4 text-on-surface-variant transition-colors duration-200 hover:bg-surface-container-low font-label-caps text-label-caps" href="#">
                    Key Pool
                </a>
<a class="h-full flex items-center px-4 text-on-surface-variant transition-colors duration-200 hover:bg-surface-container-low font-label-caps text-label-caps" href="#">
                    Logs
                </a>
<a class="h-full flex items-center px-4 text-on-surface-variant transition-colors duration-200 hover:bg-surface-container-low font-label-caps text-label-caps" href="#">
                    Settings
                </a>
</nav>
</div>
<div class="flex items-center gap-gutter">
<!-- Skeleton Toggle Placeholder -->
<div class="w-12 h-6 rounded-full shimmer opacity-50 bg-surface-container-high border border-outline-variant"></div>
<div class="hidden md:flex items-center gap-2">
<button class="px-4 py-1.5 border border-primary text-primary font-label-caps text-label-caps rounded hover:bg-surface-container-low transition-colors duration-200 opacity-50 cursor-not-allowed">
                    Create Key
                </button>
<button class="px-4 py-1.5 border border-outline-variant text-on-surface-variant font-label-caps text-label-caps rounded hover:bg-surface-container-low transition-colors duration-200 opacity-50 cursor-not-allowed">
                    Emergency Revoke
                </button>
</div>
<!-- Mobile Menu Icon (Hidden on Desktop) -->
<button class="md:hidden text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center p-container-margin w-full max-w-7xl mx-auto space-y-container-margin">
<!-- Status Squares Grid (4 pulsing rectangles) -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-gutter w-full">
<div class="h-32 bg-surface-container-high rounded border border-outline-variant pulse"></div>
<div class="h-32 bg-surface-container-high rounded border border-outline-variant pulse" style="animation-delay: 0.2s"></div>
<div class="h-32 bg-surface-container-high rounded border border-outline-variant pulse" style="animation-delay: 0.4s"></div>
<div class="h-32 bg-surface-container-high rounded border border-outline-variant pulse" style="animation-delay: 0.6s"></div>
</section>
<!-- Today Stat Row (Skeleton Bars) -->
<section class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-8 py-8 border-y border-outline-variant">
<div class="w-full md:w-1/3 h-8 bg-surface-container-high rounded shimmer"></div>
<div class="w-full md:w-1/4 h-8 bg-surface-container-high rounded shimmer" style="animation-delay: 0.3s"></div>
<div class="w-full md:w-2/5 h-8 bg-surface-container-high rounded shimmer" style="animation-delay: 0.1s"></div>
</section>
<!-- Recent-Screens Strip (5 thumbnails) -->
<section class="w-full overflow-hidden">
<div class="flex gap-gutter w-full justify-between overflow-x-auto pb-4 hide-scrollbar">
<div class="w-48 h-32 shrink-0 bg-surface-container-high rounded border border-outline-variant shimmer"></div>
<div class="w-48 h-32 shrink-0 bg-surface-container-high rounded border border-outline-variant shimmer" style="animation-delay: 0.1s"></div>
<div class="w-48 h-32 shrink-0 bg-surface-container-high rounded border border-outline-variant shimmer" style="animation-delay: 0.2s"></div>
<div class="w-48 h-32 shrink-0 bg-surface-container-high rounded border border-outline-variant shimmer" style="animation-delay: 0.3s"></div>
<div class="w-48 h-32 shrink-0 bg-surface-container-high rounded border border-outline-variant shimmer" style="animation-delay: 0.4s"></div>
</div>
<style>
                /* Hide scrollbar for cleaner look if it overflows slightly on smaller screens */
                .hide-scrollbar::-webkit-scrollbar {
                    display: none;
                }
                .hide-scrollbar {
                    -ms-overflow-style: none;
                    scrollbar-width: none;
                }
            </style>
</section>
<!-- Footer / Action -->
<footer class="mt-auto pt-container-margin w-full flex justify-center">
<button class="px-6 py-2 border border-outline-variant rounded bg-surface-container-lowest text-secondary opacity-50 cursor-not-allowed font-label-caps text-label-caps flex items-center gap-2" disabled="">
<span class="material-symbols-outlined animate-spin text-[16px]">sync</span>
                Loading pool status...
            </button>
</footer>
</main>
