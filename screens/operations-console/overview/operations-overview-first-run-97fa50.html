<body class="h-full bg-background font-body-md text-on-surface flex overflow-hidden">
<!-- Narrow SideNavBar (Icon Only Mode for Tablet) -->
<nav class="fixed left-0 top-0 h-full w-[80px] flex-shrink-0 bg-surface-container-lowest border-r border-outline-variant z-40 flex flex-col items-center py-6 gap-stack-lg">
<!-- Brand / Avatar Space -->
<div class="mb-stack-lg">
<span class="material-symbols-outlined text-primary font-bold text-3xl">token</span>
</div>
<!-- Navigation Tabs -->
<div class="flex flex-col gap-unit w-full px-2">
<!-- Active Tab: Dashboard -> Overview (Intent Match) -->
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg bg-secondary-container text-on-secondary-container relative group transition-all duration-150 ease-in-out active:scale-95" title="Dashboard">
<span class="absolute left-0 top-1/2 -translate-y-1/2 h-8 w-1 rounded-r bg-primary"></span>
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Dash</span>
</button>
<!-- Inactive Tabs -->
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors group" title="Monitoring">
<span class="material-symbols-outlined">monitoring</span>
<span class="font-label-sm text-label-sm mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Mon</span>
</button>
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors group" title="Networks">
<span class="material-symbols-outlined">hub</span>
<span class="font-label-sm text-label-sm mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Net</span>
</button>
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors group" title="Security">
<span class="material-symbols-outlined">security</span>
<span class="font-label-sm text-label-sm mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Sec</span>
</button>
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors group" title="Logs">
<span class="material-symbols-outlined">terminal</span>
<span class="font-label-sm text-label-sm mt-1 opacity-0 group-hover:opacity-100 transition-opacity">Log</span>
</button>
</div>
<div class="mt-auto flex flex-col gap-unit w-full px-2">
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Settings">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Help">
<span class="material-symbols-outlined">help</span>
</button>
<button class="flex flex-col items-center justify-center p-3 w-full rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Logout">
<span class="material-symbols-outlined">logout</span>
</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="ml-[80px] flex-1 flex flex-col min-h-screen bg-background relative overflow-y-auto">
<!-- Header (Lightweight for First Run) -->
<header class="h-16 w-full flex items-center px-container-margin border-b border-outline-variant bg-surface sticky top-0 z-30">
<h1 class="font-headline-md text-headline-md text-on-surface font-semibold">Technical Ops Dashboard</h1>
</header>
<!-- Centered Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center p-container-margin pb-32">
<!-- Empty State Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-lg max-w-md w-full flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center mb-stack-md border border-outline-variant/50">
<span class="material-symbols-outlined text-4xl text-on-surface-variant">key</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Your key pool is empty</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Add a Google API key to start routing calls</p>
<button class="bg-primary text-on-primary font-label-md text-label-md py-2 px-4 rounded hover:bg-primary-container transition-colors active:scale-95 duration-150">
                    Add key
                </button>
</div>
<!-- Disabled Toggle Below Card -->
<div class="mt-stack-lg flex items-center gap-stack-sm opacity-50 cursor-not-allowed">
<!-- Simple CSS Toggle depiction (disabled) -->
<div class="w-10 h-6 bg-surface-variant rounded-full relative border border-outline-variant">
<div class="w-4 h-4 bg-outline-variant rounded-full absolute left-1 top-0.5"></div>
</div>
<span class="font-label-md text-label-md text-outline">Service Paused</span>
</div>
<!-- Bottom Preview (Ghosted Status Squares) -->
<div class="mt-stack-lg pt-stack-lg border-t border-outline-variant/30 w-full max-w-2xl flex flex-col items-center">
<p class="font-label-sm text-label-sm text-outline mb-stack-md uppercase tracking-wider">Upcoming Status Board</p>
<div class="grid grid-cols-4 gap-gutter w-full">
<!-- Ghost Square 1 -->
<div class="aspect-square rounded-lg border border-dashed border-outline-variant/50 bg-surface-container-lowest/30 flex flex-col items-center justify-center gap-unit opacity-60">
<div class="w-6 h-6 rounded bg-surface-variant/50"></div>
<div class="w-12 h-2 rounded bg-surface-variant/30 mt-2"></div>
<div class="w-8 h-4 rounded bg-surface-variant/40 mt-1"></div>
</div>
<!-- Ghost Square 2 -->
<div class="aspect-square rounded-lg border border-dashed border-outline-variant/50 bg-surface-container-lowest/30 flex flex-col items-center justify-center gap-unit opacity-60">

<div class="w-12 h-2 rounded bg-surface-variant/30 mt-2"></div>
<div class="w-8 h-4 rounded bg-surface-variant/40 mt-1"></div>
</div>

<div class="aspect-square rounded-lg border border-dashed border-outline-variant/50 bg-surface-container-lowest/30 flex flex-col items-center justify-center gap-unit opacity-60">
<div class="w-6 h-6 rounded bg-surface-variant/50"></div>
<div class="w-12 h-2 rounded bg-surface-variant/30 mt-2"></div>
<div class="w-8 h-4 rounded bg-surface-variant/40 mt-1"></div>
</div>

<div class="aspect-square rounded-lg border border-dashed border-outline-variant/50 bg-surface-container-lowest/30 flex flex-col items-center justify-center gap-unit opacity-60">
<div class="w-6 h-6 rounded bg-surface-variant/50"></div>
<div class="w-12 h-2 rounded bg-surface-variant/30 mt-2"></div>
<div class="w-8 h-4 rounded bg-surface-variant/40 mt-1"></div>
</div>
</div>
</div>
</div>
