<script>
        // Simple toggle logic for visual feedback
        const toggle = document.getElementById('service-toggle');
        toggle.addEventListener('change', (e) => {
            const label = e.target.nextElementSibling;
            if(e.target.checked) {
                e.target.classList.add('translate-x-6');
                e.target.classList.remove('translate-x-0');
                label.classList.add('bg-primary-container');
                label.classList.remove('bg-outline-variant');
            } else {
                e.target.classList.remove('translate-x-6');
                e.target.classList.add('translate-x-0');
                label.classList.remove('bg-primary-container');
                label.classList.add('bg-outline-variant');
            }
        });
    </script>
