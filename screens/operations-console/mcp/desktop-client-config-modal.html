<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Desktop Client Config</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "#adc6ff",
              "error-container": "#93000a",
              "surface-container-lowest": "#0e0e0e",
              "surface-container": "#201f1f",
              "on-tertiary-fixed": "#410004",
              "secondary-fixed-dim": "#4edea3",
              "secondary-container": "#00a572",
              "on-surface": "#e5e2e1",
              "tertiary-fixed-dim": "#ffb3ad",
              "on-primary-fixed": "#001a42",
              "tertiary": "#ffb3ad",
              "on-secondary-fixed-variant": "#005236",
              "surface-variant": "#353534",
              "surface-container-highest": "#353534",
              "on-secondary-fixed": "#002113",
              "on-secondary": "#003824",
              "surface": "#131313",
              "secondary": "#4edea3",
              "on-tertiary-container": "#5c0008",
              "on-error": "#690005",
              "primary-fixed-dim": "#adc6ff",
              "on-surface-variant": "#c2c6d6",
              "on-tertiary-fixed-variant": "#930013",
              "error": "#ffb4ab",
              "surface-dim": "#131313",
              "primary-container": "#4d8eff",
              "background": "#131313",
              "inverse-surface": "#e5e2e1",
              "outline-variant": "#424754",
              "on-primary-container": "#00285d",
              "on-background": "#e5e2e1",
              "on-tertiary": "#68000a",
              "on-primary": "#002e6a",
              "surface-bright": "#393939",
              "inverse-primary": "#005ac2",
              "on-secondary-container": "#00311f",
              "inverse-on-surface": "#313030",
              "secondary-fixed": "#6ffbbe",
              "on-error-container": "#ffdad6",
              "surface-tint": "#adc6ff",
              "surface-container-high": "#2a2a2a",
              "primary-fixed": "#d8e2ff",
              "tertiary-fixed": "#ffdad7",
              "surface-container-low": "#1c1b1b",
              "outline": "#8c909f",
              "on-primary-fixed-variant": "#004395",
              "tertiary-container": "#ff5451"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "touch-target": "44px",
              "margin-tablet": "32px",
              "log-padding-x": "16px",
              "gutter": "24px",
              "log-padding-y": "4px",
              "base": "8px"
            },
            "fontFamily": {
              "log-entry": [
                "JetBrains Mono"
              ],
              "timestamp": [
                "JetBrains Mono"
              ],
              "log-bold": [
                "JetBrains Mono"
              ],
              "headline-md": [
                "Inter"
              ],
              "ui-main": [
                "Inter"
              ],
              "ui-sm": [
                "Inter"
              ]
            },
            "fontSize": {
              "log-entry": [
                "13px",
                {
                  "lineHeight": "20px",
                  "letterSpacing": "-0.01em",
                  "fontWeight": "400"
                }
              ],
              "timestamp": [
                "11px",
                {
                  "lineHeight": "16px",

              "log-bold": [
                "13px",

                  "fontWeight": "600"

              "ui-main": [
                "14px",

                  "lineHeight": "20px",
                  "fontWeight": "500"
                }
              ],
              "ui-sm": [
                "12px",
                {
                  "lineHeight": "16px",
                  "fontWeight": "400"
                }
              ]
            }
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-ui-main flex items-center justify-center min-h-screen">
<!-- Dimmed Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40"></div>
<!-- Modal Overlay -->
<div class="relative z-50 w-full max-w-2xl bg-surface-container-low border border-outline-variant rounded shadow-2xl overflow-hidden flex flex-col">
<!-- Header -->
<div class="flex items-center justify-between px-gutter py-4 border-b border-outline-variant bg-surface-container">
<h2 class="font-headline-md text-headline-md text-on-surface">Desktop Client Config</h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface transition-colors p-1">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="p-gutter flex flex-col gap-6">
<div class="flex flex-col gap-2">
<p class="font-ui-main text-ui-main text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="info">info</span>
                    Paste this into Anchor Assistant's settings file
                </p>
</div>
<!-- Code Block -->
<div class="relative bg-surface rounded border border-outline-variant overflow-hidden group">
<div class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity">
<button class="bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant hover:text-on-surface p-2 rounded border border-outline-variant flex items-center gap-2 transition-colors" title="Copy to clipboard">
<span class="material-symbols-outlined text-[16px]" data-icon="content_copy">content_copy</span>
</button>
</div>
<pre class="p-4 overflow-x-auto"><code class="font-log-entry text-log-entry text-on-surface whitespace-pre-wrap">{
  "mcpServers": {
    "gateway": {
      "url": "http://localhost:8080",
      "apiKey": "sk-live-92ab"
    }
  }
}</code></pre>
</div>
</div>
<!-- Footer Actions -->
<div class="px-gutter py-4 border-t border-outline-variant bg-surface-container flex justify-end gap-3">
<button class="px-4 py-2 font-ui-main text-ui-main text-on-surface bg-transparent border border-outline-variant hover:bg-surface-container-highest rounded transition-colors">
                Close
            </button>
<button class="px-4 py-2 font-ui-main text-ui-main text-on-primary bg-primary hover:bg-primary-fixed-dim rounded transition-colors font-semibold shadow-sm">
                Copy JSON
            </button>
</div>
</div>
</body></html>
