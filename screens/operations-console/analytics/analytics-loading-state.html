<style>
        /* Shimmer Animation */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #2a2a2a 4%, #333333 25%, #2a2a2a 36%);
            background-size: 1000px 100%;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-gutter w-full h-12 border-b border-outline-variant bg-surface-container-lowest sticky top-0 z-50">
<div class="flex items-center space-x-gutter">
<button class="text-on-surface-variant hover:text-on-surface transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary dark:text-primary-fixed">Analytics</h1>
</div>
<div class="flex items-center space-x-gutter">
<!-- Trailing actions (None specified, but keeping structure for consistency if needed) -->
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col py-gutter px-gutter space-y-container-margin overflow-y-auto pb-24">
<!-- Disabled Toggle Range -->
<section class="w-full flex justify-end">
<div class="flex items-center border border-outline-variant rounded-full px-component-padding-x py-component-padding-y bg-surface-container-highest opacity-50 cursor-not-allowed">
<span class="font-label-caps text-label-caps text-on-surface-variant mr-unit">Date Range: 30D</span>
<span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_drop_down</span>
</div>
</section>
<!-- Main Loading Card -->
<section class="bg-surface-container-highest border border-outline-variant rounded-lg p-container-margin flex flex-col space-y-container-margin">
<!-- Chart Skeleton -->
<div class="w-full h-48 animate-shimmer rounded"></div>
<!-- Loading Text -->
<div class="text-center">
<p class="font-data-mono text-data-mono text-on-surface-variant opacity-70">Loading 30-day trend…</p>
</div>
<!-- Stat Rows Skeletons -->
<div class="flex flex-col space-y-gutter w-full mt-container-margin">
<div class="h-8 animate-shimmer rounded w-full"></div>
<div class="h-8 animate-shimmer rounded w-5/6"></div>
<div class="h-8 animate-shimmer rounded w-4/6"></div>
</div>
</section>
<!-- Spacer for visual balance -->
<div class="h-16"></div>
</main>
<!-- Bottom Tab Bar (Dimmed Navigation) -->
<!-- Note: Following semantic mapping, highlighting a default or none if strictly loading. Will use intent fallback. -->
<nav class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant flex justify-around py-component-padding-y opacity-50 pb-safe z-50">

<div class="flex flex-col items-center justify-center p-unit cursor-not-allowed">
<span class="material-symbols-outlined text-secondary">home</span>
