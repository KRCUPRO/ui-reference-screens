<style>

    -moz-osx-font-smoothing: grayscale;
  }

    background-color: rgba(27, 26, 41, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

    animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;

<body class="bg-surface-bg text-on-surface h-screen w-screen overflow-hidden flex justify-center items-center font-sans">
<!-- Mobile Device Container for Preview (Max 430px width for realistic mobile feel) -->
<div class="relative w-full max-w-[430px] h-full max-h-[932px] bg-background md:border md:border-border-subtle md:rounded-[40px] md:shadow-2xl overflow-hidden flex flex-col">
<!-- TOP APP BAR -->
<header class="bg-surface-container-lowest flex items-center px-container-padding h-16 w-full border-b border-outline-variant z-10 shrink-0">
<button class="mr-4 p-2 -ml-2 text-primary-container rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary-container flex-grow text-center pr-10">Analytics</h1>
</header>
<!-- BACKGROUND DASHBOARD (Blurred via pseudo-element or container wrapper) -->
<main aria-hidden="true" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 relative select-none">
<!-- Metric Cards Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Card 1 -->
<div class="bg-surface-card border border-border-subtle rounded p-4 flex flex-col justify-between">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">Total Users</div>
<div class="font-display-metric text-display-metric text-on-surface">24.5k</div>
<div class="flex items-center text-primary mt-2">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-data-mono-bold text-data-mono-bold ml-1">+12%</span>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-card border border-border-subtle rounded p-4 flex flex-col justify-between">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">Sessions</div>
<div class="font-display-metric text-display-metric text-on-surface">8.2k</div>
<div class="flex items-center text-primary mt-2">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-data-mono-bold text-data-mono-bold ml-1">+5.4%</span>
</div>
</div>
</div>
<!-- Chart Placeholder -->
<div class="bg-surface-card border border-border-subtle rounded p-4 h-48 flex flex-col">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Traffic Overview</div>
<div class="flex-1 flex items-end justify-between gap-1">
<!-- Simulated Chart Bars -->
<div class="w-full bg-surface-variant rounded-t" style="height: 30%;"></div>
<div class="w-full bg-surface-variant rounded-t" style="height: 50%;"></div>
<div class="w-full bg-surface-variant rounded-t" style="height: 40%;"></div>
<div class="w-full bg-primary-fixed rounded-t" style="height: 80%;"></div>
<div class="w-full bg-surface-variant rounded-t" style="height: 60%;"></div>
<div class="w-full bg-surface-variant rounded-t" style="height: 45%;"></div>
<div class="w-full bg-surface-variant rounded-t" style="height: 90%;"></div>
</div>
<div class="flex justify-between mt-2 font-data-mono text-data-mono text-outline">
<span>Mon</span>
<span>Sun</span>
</div>
</div>
<!-- Table Placeholder -->
<div class="bg-surface-card border border-border-subtle rounded overflow-hidden">
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase p-4 border-b border-border-subtle">Top Sources</div>
<div class="divide-y divide-border-subtle">
<div class="flex justify-between p-3 font-data-mono text-data-mono">
<span class="text-on-surface">google.com</span>
<span class="font-data-mono-bold text-on-surface">45%</span>
</div>
<div class="flex justify-between p-3 font-data-mono text-data-mono border-l-2 border-peak-indicator bg-surface-container-low">
<span class="text-on-surface">direct</span>
<span class="font-data-mono-bold text-on-surface">30%</span>
</div>
<div class="flex justify-between p-3 font-data-mono text-data-mono">
<span class="text-on-surface">twitter.com</span>
<span class="font-data-mono-bold text-on-surface">15%</span>
</div>
</div>
</div>
</main>
<!-- BOTTOM NAV BAR (Inactive in background) -->
<nav class="bg-surface-container-lowest fixed bottom-0 left-0 w-full md:absolute flex justify-around items-center px-4 py-3 pb-safe border-t border-outline-variant z-10 shrink-0">

<span class="material-symbols-outlined">home</span>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<div class="flex flex-col items-center justify-center text-outline p-2">
<span class="material-symbols-outlined">settings</span>
</div>
</nav>

<!-- Backdrop -->
<div aria-hidden="true" class="absolute inset-0 sheet-backdrop z-40"></div>
<!-- Sheet Container -->
<div class="absolute bottom-0 left-0 w-full bg-surface-card border-t border-border-subtle rounded-t-xl z-50 animate-slide-up flex flex-col max-h-[751px]">
<!-- Drag Handle (Visual only) -->
<div class="w-full flex justify-center py-3">
<div class="w-10 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-gutter pb-4 border-b border-border-subtle">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Export analytics</h2>
</div>
<!-- Sheet Body -->
<div class="p-gutter flex flex-col gap-6 overflow-y-auto">
<!-- Empty State Block -->
<div class="flex flex-col items-center justify-center py-8 text-center">
<span class="font-body-md text-body-md text-secondary mb-1">No exports yet</span>
<span class="font-label-caps text-label-caps text-outline uppercase">Your first export will appear here</span>
</div>
<!-- Controls: Segmented Toggle for Format -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Format</label>
<div class="flex border border-border-subtle rounded overflow-hidden bg-surface-container-lowest">
<button class="flex-1 py-2 font-data-mono-bold text-data-mono-bold text-on-primary bg-primary border-r border-border-subtle focus:outline-none">CSV</button>
<button class="flex-1 py-2 font-data-mono text-data-mono text-on-surface hover:bg-surface-container-low transition-colors focus:outline-none">JSON</button>
</div>
</div>
</div>
<!-- Sheet Footer / Action -->
<div class="p-gutter border-t border-border-subtle bg-surface-container-lowest pb-safe">
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded font-label-caps text-label-caps uppercase tracking-wider border border-primary hover:bg-surface-tint active:scale-95 transition-all duration-100 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">download</span>
            Export last 30 days
        </button>
</div>
