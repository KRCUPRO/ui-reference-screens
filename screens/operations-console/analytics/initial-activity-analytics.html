<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Analytics - Sparse Data</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-family: 'Material Symbols Outlined';
                font-weight: normal;
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                letter-spacing: normal;
                text-transform: none;
                display: inline-block;
                white-space: nowrap;
                word-wrap: normal;
                direction: ltr;
                -webkit-font-feature-settings: 'liga';
                -webkit-font-smoothing: antialiased;
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-tertiary-fixed": "#1a1c1e",
                        "surface-dim": "#0d1515",
                        "primary": "#e9feff",
                        "outline-variant": "#3a494a",
                        "secondary": "#c6c6c6",
                        "error": "#ffb4ab",
                        "tertiary": "#fafafc",
                        "inverse-on-surface": "#2a3232",
                        "primary-fixed-dim": "#00dce5",
                        "on-secondary": "#303030",
                        "on-secondary-container": "#b5b5b5",
                        "on-tertiary-fixed-variant": "#454749",
                        "on-secondary-fixed": "#1b1b1b",
                        "on-surface-variant": "#b9caca",
                        "error-container": "#93000a",
                        "surface-bright": "#323b3b",
                        "tertiary-container": "#dddde0",
                        "primary-container": "#00f5ff",
                        "on-tertiary": "#2f3133",
                        "secondary-container": "#474747",
                        "tertiary-fixed-dim": "#c6c6c9",
                        "on-surface": "#dce4e4",
                        "outline": "#849495",
                        "on-background": "#dce4e4",
                        "on-primary-fixed": "#002021",
                        "surface-container-high": "#232b2c",
                        "surface": "#0d1515",
                        "on-primary-fixed-variant": "#004f53",
                        "tertiary-fixed": "#e2e2e5",
                        "surface-container": "#192121",
                        "on-primary": "#003739",
                        "surface-variant": "#2e3637",
                        "surface-container-low": "#151d1d",
                        "surface-tint": "#00dce5",
                        "on-primary-container": "#006c71",
                        "primary-fixed": "#63f7ff",
                        "inverse-primary": "#00696e",
                        "surface-container-lowest": "#081010",
                        "background": "#0d1515",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#606163",
                        "surface-container-highest": "#2e3637",
                        "inverse-surface": "#dce4e4",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-fixed-variant": "#474747",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "unit": "4px",
                        "container-padding": "20px",
                        "stack-sm": "8px",
                        "gutter": "12px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-main": ["JetBrains Mono"],
                        "code-sm": ["JetBrains Mono"],
                        "data-lg": ["JetBrains Mono"],
                        "h1-mobile": ["Sora"],
                        "h1": ["Sora"],
                        "label-caps": ["JetBrains Mono"],
                        "h2": ["Sora"]
                    },
                    "fontSize": {
                        "body-main": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "code-sm": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "data-lg": ["24px", { "lineHeight": "1", "letterSpacing": "-0.04em", "fontWeight": "500" }],
                        "h1-mobile": ["26px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["11px", { "lineHeight": "1", "letterSpacing": "0.08em", "fontWeight": "700" }],
                        "h2": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-main selection:bg-primary-container selection:text-black">
<!-- TopAppBar -->
<header class="w-full top-0 flex items-center justify-between px-container-padding h-16 bg-surface dark:bg-surface border-b border-outline-variant z-40">
<div class="flex items-center gap-gutter">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="terminal">terminal</span>
<h1 class="font-h2 text-h2 font-bold tracking-tighter text-primary dark:text-primary-fixed-dim uppercase">SYSTEM_CORE</h1>
</div>
</header>
<!-- Main Content Canvas (Sparse Data State) -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding w-full max-w-md mx-auto pb-24 pt-8">
<!-- Context Text -->
<p class="font-body-main text-body-main text-on-surface-variant mb-stack-lg text-center tracking-tight">
            6 calls total · first activity today
        </p>
<!-- Minimalist Brutalist Chart Card -->
<div class="w-full border-t-2 border-primary-container bg-surface-container-lowest p-stack-lg flex flex-col gap-stack-md relative">
<div class="flex justify-between items-end h-32 w-full border-b border-on-tertiary-fixed pb-2">
<!-- Mon (Zero state) -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="w-full max-w-[8px] bg-on-tertiary-fixed h-[1px]"></div>
</div>
<!-- Tue (Zero state) -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="w-full max-w-[8px] bg-on-tertiary-fixed h-[1px]"></div>
</div>
<!-- Today (Active state) -->
<div class="flex flex-col items-center gap-stack-sm flex-1 relative group">
<div class="w-full max-w-[12px] bg-primary-container h-full relative z-10 shadow-[0_0_15px_rgba(0,245,255,0.2)]"></div>
</div>
<!-- Thu (Zero state) -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="w-full max-w-[8px] bg-on-tertiary-fixed h-[1px]"></div>
</div>
<!-- Fri (Zero state) -->
<div class="flex flex-col items-center gap-stack-sm flex-1">
<div class="w-full max-w-[8px] bg-on-tertiary-fixed h-[1px]"></div>
</div>
</div>
<!-- X-Axis Labels -->
<div class="flex justify-between w-full font-code-sm text-code-sm uppercase">
<span class="text-on-tertiary-fixed-variant flex-1 text-center">Mon</span>
<span class="text-on-tertiary-fixed-variant flex-1 text-center">Tue</span>
<span class="text-primary-container flex-1 text-center font-bold">Today</span>
<span class="text-on-tertiary-fixed-variant flex-1 text-center">Thu</span>
<span class="text-on-tertiary-fixed-variant flex-1 text-center">Fri</span>
</div>
</div>
<!-- Status Square -->
<div class="mt-stack-lg border border-on-tertiary-fixed w-full max-w-[200px] aspect-square flex items-center justify-center p-stack-md bg-[#0A0A0A]">
<span class="font-code-sm text-code-sm text-on-surface text-center uppercase tracking-widest">
                Pool just started
            </span>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-container-padding bg-surface dark:bg-surface border-t border-outline-variant">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-outline dark:text-outline hover:text-primary transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="home">home</span>
</button>
<!-- Analytics (Active) -->
<button class="flex flex-col items-center justify-center text-primary dark:text-primary-container bg-transparent hover:text-primary transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="analytics" data-weight="fill" style="font-variation-settings: 'FILL' 1;">analytics</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-outline dark:text-outline hover:text-primary transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</nav>
</body></html>
