<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KeyOps Console - Analytics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#3525cd",
                        "on-error-container": "#93000a",
                        "secondary": "#5f5e5e",
                        "on-secondary-fixed-variant": "#474647",
                        "secondary-fixed": "#e5e2e1",
                        "on-surface": "#1b1a29",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-card": "#ffffff",
                        "surface-tint": "#4d44e3",
                        "peak-indicator": "#4f46e5",
                        "error-alert": "#ba1a1a",
                        "surface-bg": "#f7f9fd",
                        "surface-variant": "#e4e0f5",
                        "on-primary-container": "#b1afff",
                        "tertiary-fixed": "#ffdbcc",
                        "outline": "#777587",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-container-highest": "#e4e0f5",
                        "on-tertiary-container": "#ff9f72",
                        "tertiary": "#592000",
                        "surface-container-low": "#f6f2ff",
                        "primary": "#1e00a9",
                        "on-secondary-container": "#636262",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#7d3000",
                        "on-background": "#1b1a29",
                        "outline-variant": "#c7c4d8",
                        "inverse-surface": "#302f3e",
                        "on-tertiary-fixed": "#351000",
                        "primary-fixed": "#e2dfff",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "surface": "#fcf8ff",
                        "tertiary-fixed-dim": "#ffb694",
                        "on-surface-variant": "#464555",
                        "error": "#ba1a1a",
                        "surface-bright": "#fcf8ff",
                        "surface-container-high": "#e9e6fa",
                        "secondary-fixed-dim": "#c8c6c6",
                        "on-secondary-fixed": "#1c1b1c",
                        "on-primary": "#ffffff",
                        "background": "#fcf8ff",
                        "secondary-container": "#e2dfdf",
                        "inverse-primary": "#c3c0ff",
                        "surface-dim": "#dbd8ec",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f2efff",
                        "on-primary-fixed": "#0f0069",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-container": "#efebff",
                        "border-subtle": "#c7c4d8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-margin": "32px",
                        "component-padding-x": "12px",
                        "unit": "4px",
                        "component-padding-y": "8px"
                    },
                    "fontFamily": {
                        "data-tooltip": ["JetBrains Mono"],
                        "data-mono-bold": ["JetBrains Mono"],
                        "label-caps": ["Inter"],
                        "display-metric": ["Inter"],
                        "body-md": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "data-tooltip": ["10px", { "lineHeight": "12px", "fontWeight": "400" }],
                        "data-mono-bold": ["13px", { "lineHeight": "18px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-metric": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "data-mono": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-bg text-on-surface h-screen flex overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- SideNavBar -->
<nav class="bg-surface-container-lowest w-64 h-screen border-r border-outline-variant flex flex-col py-gutter space-y-unit hidden md:flex shrink-0">
<div class="px-gutter mb-6">
<h1 class="font-headline-sm text-headline-sm font-semibold text-on-surface">KeyOps Console</h1>
<p class="font-data-mono text-data-mono text-secondary mt-1">V2.4.0</p>
</div>
<div class="flex-1 overflow-y-auto space-y-1">
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Overview</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Key Pool</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Logs</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Rate Limits</a>
<!-- Active Tab: Usage maps to Analytics intent -->
<a class="block py-2 text-primary font-semibold border-l-2 border-primary pl-4 font-label-caps text-label-caps bg-surface-container-low" href="#">Usage</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Health</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Security</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Webhooks</a>
<a class="block py-2 text-secondary pl-4 opacity-80 hover:bg-surface-container transition-colors duration-150 font-label-caps text-label-caps" href="#">Settings</a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col h-screen overflow-hidden bg-surface-bg relative">
<!-- TopAppBar (Mobile Only - Replaces SideNav on small screens per blueprint) -->
<header class="bg-surface-container-lowest w-full h-12 border-b border-outline-variant flex justify-between items-center px-gutter md:hidden shrink-0">
<div class="font-label-caps text-label-caps font-bold text-primary">System Status: Active</div>
<div class="flex items-center space-x-2">
<button class="font-label-caps text-label-caps border border-primary text-primary px-3 py-1 rounded hover:bg-surface-container-low transition-colors duration-200">Create Key</button>
</div>
</header>
<!-- Canvas -->
<div class="flex-1 overflow-y-auto p-container-margin flex flex-col">
<!-- Section Header -->
<div class="mb-container-margin border-b border-outline-variant pb-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Analytics</h2>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center max-w-2xl mx-auto w-full">
<div class="bg-surface-card border border-outline-variant rounded-lg p-container-margin w-full text-center flex flex-col items-center shadow-sm">
<!-- Geometric Glyph -->
<div class="w-16 h-16 mb-6 border border-outline-variant bg-surface-container-lowest rounded flex items-center justify-center transform rotate-3">
<span class="material-symbols-outlined text-secondary" data-icon="insert_chart" style="font-size: 32px;">insert_chart</span>
</div>
<!-- Typography -->
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-2">No calls yet</h3>
<p class="font-body-md text-body-md text-secondary mb-8 max-w-md mx-auto">Once your keys start receiving traffic, charts will appear here.</p>
<!-- Action -->
<button class="font-label-caps text-label-caps border border-primary text-primary bg-surface-container-lowest hover:bg-surface-container-low transition-colors duration-200 px-6 py-3 rounded uppercase tracking-wider font-semibold">
                        Add your first key
                    </button>
</div>
</div>
</div>
</main>
</body></html>
