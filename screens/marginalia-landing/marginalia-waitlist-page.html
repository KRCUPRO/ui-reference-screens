<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Waitlist - Marginalia</title>

              "on-secondary-fixed": "#1b1c1c",
              "tertiary-fixed": "#e6e2df",
              "surface-container-high": "#ebe7e6",
              "tertiary": "#000000",
              "on-surface": "#1c1b1b",
              "on-primary": "#ffffff",

            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "margin-page": "16px",
              "unit": "4px",
              "gutter": "8px",
              "column-gap": "12px",
              "row-gap": "4px"
            },
            "fontFamily": {
              "label-caps": [
                "Archivo Narrow"
              ],
              "headline-md": [

<style>
        body {
            /* Fallback font family applied globally if needed, though Tailwind handles it via utilities */
        }
        
        /* Rigid grid system classes */
        .rigid-grid-container {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 0;
            border-left: 1px solid #333333;
            border-top: 1px solid #333333;
        }
        
        .rigid-grid-item {
            border-right: 1px solid #333333;
            border-bottom: 1px solid #333333;
            padding: 1.5rem; /* Generous internal padding for the grid cells */
        }
        
        /* 1px Rules for structural borders */
        .structural-rule-bottom {
            border-bottom: 1px solid #333333;
        }
        .structural-rule-top {
            border-top: 1px solid #333333;
        }
        .structural-rule-left {
            border-left: 1px solid #333333;
        }
        .structural-rule-right {
            border-right: 1px solid #333333;
        }
        
        /* Primary Button Style from guidance */
        .btn-primary-rigid {
            background-color: #1A1A1A;
            color: #F9F7F2;
            border: 1px solid #1A1A1A;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .btn-primary-rigid:hover {
            background-color: #333333; /* Slight variation for hover since glow is forbidden */
        }
        
        /* Input Field Style from guidance (bottom border only or full box, let's use full box for emphasis) */
        .input-rigid {
            border: 1px solid #333333;
            background-color: transparent;
            border-radius: 0; /* Override any tailwind border radius for inputs */
        }
        .input-rigid:focus {
            outline: none;
            border-color: #1A1A1A;
            box-shadow: none; /* No shadow */
        }

    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-tertiary-container selection:text-on-tertiary">
<!-- TopNavBar -->
<header class="bg-surface dark:bg-surface fixed top-0 w-full z-50 flex justify-center items-center h-24 px-margin-page structural-rule-bottom">
<!-- Render only the brand wordmark centered, as requested -->
<div class="font-label-caps text-label-caps tracking-widest text-primary dark:text-on-surface uppercase">
            Marginalia
        </div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-4 sm:px-6 lg:px-8">
<!-- Centered Card Container (Max width 420px) -->
<div class="w-full max-w-[420px]">
<!-- Card Body (Framed in 1px border) -->
<div class="border border-[#333333] bg-surface p-8 sm:p-12">
<h1 class="font-headline-lg text-headline-lg text-primary mb-8 text-center">
                    Get early access
                </h1>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="email">Email</label>
<input class="input-rigid block w-full px-4 py-3 font-body-md text-body-md text-primary placeholder:text-on-surface-variant focus:ring-0" id="email" name="email" placeholder="" required="" type="email"/>
</div>
<!-- Team Size Dropdown -->
<div class="space-y-1">
<label class="block font-label-caps text-label-caps text-on-surface uppercase" for="team_size">Team size</label>
<div class="relative">
<select class="input-rigid block w-full pl-4 pr-10 py-3 font-body-md text-body-md text-primary appearance-none focus:ring-0 cursor-pointer bg-transparent" id="team_size" name="team_size">
<option class="text-on-surface-variant" disabled="" selected="" value="">Select one</option>
<option value="1">1 (Just me)</option>
<option value="2-5">2 - 5</option>
<option value="6-10">6 - 10</option>
<option value="11-50">11 - 50</option>
<option value="51+">51+</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-primary">
<span class="material-symbols-outlined" style="font-size: 20px;">expand_more</span>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="btn-primary-rigid w-full flex justify-center py-4 px-4 font-label-caps text-label-caps uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1A1A1A]" type="submit">
                            Join the waitlist
                        </button>
</div>
</form>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface dark:bg-surface fixed bottom-0 w-full flex justify-center items-center py-stack-sm opacity-0 pointer-events-none z-40">
<div class="font-body-sm text-body-sm text-primary dark:text-on-surface">
            © 2024 Marginalia
        </div>
</footer>
</body></html>
