<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24
        }

            background-color: #fdf8f8; /* Cream base */
        }

<body class="bg-background text-on-background min-h-screen antialiased flex flex-col items-center justify-center pt-section-gap pb-section-gap px-gutter md:px-[100px] selection:bg-surface-variant selection:text-primary">
<main class="w-full max-w-[768px] mx-auto flex flex-col items-center space-y-stack-lg">
<!-- Headline -->
<div class="text-center w-full max-w-2xl">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary">
                Ask about anything in your files
            </h1>
</div>
<!-- Search Input -->
<div class="w-full relative group">
<input aria-label="Search your files" class="w-full bg-surface-container-lowest border border-outline-variant rounded-full py-stack-md pl-gutter pr-16 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm group-hover:shadow-md" placeholder="Ask about the Q3 board deck..." type="text"/>
<button aria-label="Submit search" class="absolute right-unit top-1/2 -translate-y-1/2 p-stack-sm rounded-full bg-primary text-on-primary hover:bg-inverse-surface transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Citation Preview Card -->
<div class="w-full max-w-xl border border-surface-variant bg-surface-container-low rounded-lg p-stack-md flex flex-col space-y-unit mt-stack-md hover:bg-surface-container transition-colors cursor-pointer">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="description">description</span>
<span class="font-label-bold text-label-bold text-primary tracking-wider uppercase">Source: Q3-Board-Deck.pdf, p.12</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant truncate">
                "...resulting in a 14% year-over-year increase in aggregate operating margin, primarily driven by..."
            </p>
</div>
<!-- Caption -->
<div class="pt-section-gap w-full text-center">
<p class="font-caption text-caption text-outline">
                4,200 documents indexed this week
            </p>
</div>
</main>
