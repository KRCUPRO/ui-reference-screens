<script>
        // Simple accordion interaction script
        document.querySelectorAll('button[aria-expanded]').forEach(button => {
            button.addEventListener('click', function() {
                const isExpanded = this.getAttribute('aria-expanded') === 'true';
                // Note: In a real implementation, this would handle opening the content panel.
                // For this static demo based on the prompt, the second row is hardcoded open,
                // and the others are hardcoded closed. This script just toggles the aria attribute.
                this.setAttribute('aria-expanded', !isExpanded);
                
                // Toggle chevron rotation for collapsed items (basic interaction hint)
                const chevron = this.querySelector('.material-symbols-outlined');
                if (chevron && this.nextElementSibling && !this.nextElementSibling.classList.contains('overflow-hidden')) {
                    chevron.classList.toggle('rotate-90');
                }
            });
        });
    </script>
