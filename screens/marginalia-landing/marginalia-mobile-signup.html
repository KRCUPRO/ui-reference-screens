<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
<header class="w-full sticky top-0 flex justify-between items-center px-margin-mobile h-16 w-full bg-surface">
<button aria-label="Back" class="p-2 -ml-2 text-primary hover:bg-surface-container-low active:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">
      Marginalia
    </div>
<div class="w-8"></div>
</header>
<main class="flex-grow flex flex-col px-margin-mobile pt-16 pb-margin-mobile w-full max-w-[480px] mx-auto">
<div class="mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Create account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join Marginalia to begin your research.</p>
</div>
<form class="flex flex-col space-y-4">
<div class="flex flex-col">
<label class="sr-only" for="email">Email address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-primary placeholder-outline transition-colors" id="email" placeholder="Email address" type="email"/>
</div>
<div class="flex flex-col">
<label class="sr-only" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-primary placeholder-outline transition-colors" id="password" placeholder="Password" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary py-4 mt-8 font-label-sm text-label-sm uppercase tracking-widest hover:bg-primary-container active:scale-[0.98] transition-all" type="submit">
        Create account
      </button>
</form>
<div class="flex items-center my-10">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-label-sm text-label-sm text-outline uppercase tracking-widest bg-surface">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="flex flex-col space-y-4">
<button class="w-full flex items-center justify-center py-4 border border-outline-variant hover:bg-surface-container-low active:bg-surface-container transition-colors" type="button">

</button>
<button class="w-full flex items-center justify-center py-4 border border-outline-variant hover:bg-surface-container-low active:bg-surface-container transition-colors" type="button">
<span class="font-body-md text-body-md text-primary font-medium">Microsoft</span>
</button>
</div>
