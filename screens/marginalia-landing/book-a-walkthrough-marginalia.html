<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Marginalia - Demo Booking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&amp;family=Source+Serif+4:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-container-high": "#ebe7e6",
          "on-primary-container": "#858383",
          "inverse-primary": "#c8c6c5",
          "surface-dim": "#ddd9d8",
          "on-tertiary": "#ffffff",
          "tertiary-container": "#1c1b1a",
          "surface-variant": "#e5e2e1",
          "secondary-fixed-dim": "#c8c6c6",
          "error-container": "#ffdad6",
          "secondary-container": "#e4e2e1",
          "inverse-on-surface": "#f4f0ef",
          "surface-container-highest": "#e5e2e1",
          "primary": "#000000",
          "on-error-container": "#93000a",
          "on-background": "#1c1b1b",
          "on-secondary-fixed": "#1b1c1c",
          "on-tertiary-fixed-variant": "#484645",
          "on-surface": "#1c1b1b",
          "on-surface-variant": "#444748",
          "outline": "#747878",
          "on-tertiary-fixed": "#1c1b1a",
          "surface-container-lowest": "#ffffff",
          "surface-container": "#f1edec",
          "error": "#ba1a1a",
          "primary-fixed": "#e5e2e1",
          "secondary-fixed": "#e4e2e1",
          "secondary": "#5f5e5e",
          "on-primary-fixed": "#1c1b1b",
          "surface-container-low": "#f7f3f2",
          "on-secondary-container": "#656464",
          "on-primary-fixed-variant": "#474746",
          "inverse-surface": "#313030",
          "background": "#fdf8f8",
          "tertiary-fixed-dim": "#cac6c4",
          "tertiary-fixed": "#e6e2df",
          "tertiary": "#000000",
          "on-secondary": "#ffffff",
          "outline-variant": "#c4c7c7",
          "on-tertiary-container": "#868382",
          "on-error": "#ffffff",
          "primary-container": "#1c1b1b",
          "primary-fixed-dim": "#c8c6c5",
          "on-secondary-fixed-variant": "#474747",
          "surface-bright": "#fdf8f8",
          "surface": "#fdf8f8",
          "surface-tint": "#5f5e5e",
          "on-primary": "#ffffff"
        },
        "borderRadius": {
          "DEFAULT": "0.25rem",
          "lg": "0.5rem",
          "xl": "0.75rem",
          "full": "9999px"
        },
        "spacing": {
          "column-gap": "12px",
          "gutter": "8px",
          "margin-page": "16px",
          "unit": "4px",
          "row-gap": "4px"
        },
        "fontFamily": {
          "footer-note": [
            "Archivo Narrow"
          ],
          "label-caps": [
            "Archivo Narrow"
          ],
          "headline-md": [
            "\"Source Serif 4\""
          ],
          "headline-lg": [
            "\"Source Serif 4\""
          ],
          "body-sm": [
            "\"Source Serif 4\""
          ],
          "body-md": [
            "\"Source Serif 4\""
          ]
        },
        "fontSize": {
          "footer-note": [
            "10px",
            {
              "lineHeight": "14px",
              "letterSpacing": "0.01em",

            }
          ],
          "label-caps": [
            "11px",
            {
              "lineHeight": "12px",

              "fontWeight": "700"
            }
          ],
          "headline-md": [

            {
              "lineHeight": "24px",
              "fontWeight": "700"
            }
          ],
          "headline-lg": [

              "lineHeight": "32px",
              "letterSpacing": "-0.02em",

          ],
          "body-sm": [
            "12px",
            {
              "lineHeight": "16px",
              "fontWeight": "400"
            }
          ],
          "body-md": [
            "14px",
            {
              "lineHeight": "18px",
              "fontWeight": "400"
            }
          ]
        }
      },
    },
  }
</script>
<style>
  body {
    background-color: theme('colors.background');
    color: theme('colors.on-background');
  }
  .border-1px {
    border-width: 1px;
    border-color: theme('colors.primary');
  }
  .border-b-1px {
    border-bottom-width: 1px;
    border-bottom-color: theme('colors.primary');
  }
  .border-r-1px {
    border-right-width: 1px;
    border-right-color: theme('colors.primary');
  }
  .border-t-1px {
    border-top-width: 1px;
    border-top-color: theme('colors.primary');
  }
</style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopNavBar (Shared Component) - Suppressed because this is a transactional flow (Booking) -->
<main class="flex-grow flex items-center justify-center p-margin-page">
<div class="max-w-4xl w-full border-1px bg-surface-container-lowest">
<!-- Header -->
<div class="p-8 border-b-1px text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Book a 20-minute walkthrough</h1>
<p class="font-body-sm text-body-sm text-secondary">Select a date and time to explore Marginalia.</p>
</div>
<!-- Split Content -->
<div class="flex flex-col md:flex-row">
<!-- Left Column: Calendar (45%) -->
<div class="w-full md:w-[45%] p-8 border-b-1px md:border-b-0 md:border-r-1px">
<div class="flex items-center justify-between mb-6">
<h2 class="font-headline-md text-headline-md text-primary">October 2024</h2>
<div class="flex gap-2">
<button aria-label="Previous Month" class="w-8 h-8 flex items-center justify-center border-1px hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary text-[16px]">chevron_left</span>
</button>
<button aria-label="Next Month" class="w-8 h-8 flex items-center justify-center border-1px hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-primary text-[16px]">chevron_right</span>
</button>
</div>
</div>
<div class="grid grid-cols-7 gap-1 text-center font-label-caps text-label-caps text-secondary mb-2">
<div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-1 text-center font-body-sm text-body-sm text-primary">
<!-- Empty days for start of month -->
<div class="p-2"></div><div class="p-2"></div>
<!-- Days 1-31 -->
<button class="p-2 border border-transparent hover:border-primary">1</button>
<button class="p-2 border border-transparent hover:border-primary">2</button>
<button class="p-2 border border-transparent hover:border-primary">3</button>
<button class="p-2 border border-transparent hover:border-primary">4</button>
<button class="p-2 border border-transparent hover:border-primary">5</button>
<button class="p-2 border border-transparent hover:border-primary">6</button>
<button class="p-2 border border-transparent hover:border-primary">7</button>
<button class="p-2 border border-transparent hover:border-primary">8</button>
<button class="p-2 border border-transparent hover:border-primary">9</button>
<button class="p-2 border border-transparent hover:border-primary">10</button>
<button class="p-2 border border-transparent hover:border-primary">11</button>
<button class="p-2 border border-transparent hover:border-primary">12</button>
<button class="p-2 border border-transparent hover:border-primary">13</button>
<!-- Selected Date -->
<button class="p-2 bg-primary text-on-primary font-bold">14</button>
<button class="p-2 border border-transparent hover:border-primary">15</button>
<button class="p-2 border border-transparent hover:border-primary">16</button>
<button class="p-2 border border-transparent hover:border-primary">17</button>
<button class="p-2 border border-transparent hover:border-primary">18</button>
<button class="p-2 border border-transparent hover:border-primary">19</button>
<button class="p-2 border border-transparent hover:border-primary">20</button>
<button class="p-2 border border-transparent hover:border-primary">21</button>
<button class="p-2 border border-transparent hover:border-primary">22</button>
<button class="p-2 border border-transparent hover:border-primary">23</button>
<button class="p-2 border border-transparent hover:border-primary">24</button>
<button class="p-2 border border-transparent hover:border-primary">25</button>
<button class="p-2 border border-transparent hover:border-primary">26</button>
<button class="p-2 border border-transparent hover:border-primary">27</button>
<button class="p-2 border border-transparent hover:border-primary">28</button>
<button class="p-2 border border-transparent hover:border-primary">29</button>
<button class="p-2 border border-transparent hover:border-primary">30</button>
<button class="p-2 border border-transparent hover:border-primary">31</button>
</div>
</div>
<!-- Right Column: Time Slots (55%) -->
<div class="w-full md:w-[55%] p-8 flex flex-col">
<div class="flex items-center justify-between mb-6">
<h2 class="font-headline-md text-headline-md text-primary">Monday, October 14</h2>
<div class="relative inline-block w-40">
<select class="block w-full appearance-none bg-transparent border-b-1px rounded-none py-1 pl-0 pr-6 font-label-caps text-label-caps text-primary focus:outline-none focus:ring-0 focus:border-primary cursor-pointer">
<option>Pacific Time (PT)</option>
<option>Eastern Time (ET)</option>
<option>Central European (CET)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center">
<span class="material-symbols-outlined text-[14px]">arrow_drop_down</span>
</div>
</div>
</div>
<div class="flex-grow flex flex-col gap-4 overflow-y-auto pr-2">
<!-- Time Slots -->
<button class="w-full py-4 border-1px text-center font-body-md text-body-md text-primary hover:bg-surface-container transition-colors focus:bg-primary focus:text-on-primary outline-none">
              9:00 AM
            </button>
<button class="w-full py-4 border-1px text-center font-body-md text-body-md text-primary hover:bg-surface-container transition-colors focus:bg-primary focus:text-on-primary outline-none">
              11:30 AM
            </button>
<button class="w-full py-4 border-1px text-center font-body-md text-body-md text-primary hover:bg-surface-container transition-colors focus:bg-primary focus:text-on-primary outline-none">
              2:00 PM
            </button>
<button class="w-full py-4 border-1px text-center font-body-md text-body-md text-primary hover:bg-surface-container transition-colors focus:bg-primary focus:text-on-primary outline-none">
              4:15 PM
            </button>
</div>
<div class="mt-8 pt-4 border-t-1px flex justify-end">
<button class="px-8 py-3 bg-primary text-on-primary font-label-caps text-label-caps hover:bg-inverse-surface transition-colors">Confirm Booking</button>
</div>
</div>
</div>
</div>
</main>
<!-- Footer (Shared Component) - Rendered as per instructions, though Nav is suppressed -->
<footer class="w-full px-margin-page py-4 flex justify-between items-center border-t border-primary dark:border-outline bg-surface-container-lowest dark:bg-primary-container">
<div class="flex items-center gap-4">
<span class="font-label-caps text-label-caps font-bold text-primary dark:text-primary-fixed">MARGINALIA</span>
<span class="font-footer-note text-footer-note text-secondary dark:text-secondary-fixed-dim">© 2024 Marginalia Systems. All citations verified.</span>
</div>
<div class="flex gap-4">
<a class="font-footer-note text-footer-note text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed" href="#">Privacy</a>
<a class="font-footer-note text-footer-note text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed" href="#">Terms</a>
<a class="font-footer-note text-footer-note text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed" href="#">API</a>
<a class="font-footer-note text-footer-note text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed" href="#">Changelog</a>
</div>
</footer>
</body></html>
