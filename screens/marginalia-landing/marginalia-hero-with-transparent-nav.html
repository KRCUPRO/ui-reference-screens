<!DOCTYPE html>

<style>
    /* Custom utility for the grain texture */
    .bg-grain {
      position: relative;
    }
    .bg-grain::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }
    /* Ensure content stays above the grain */
    .content-overlay {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-surface font-ui-medium text-on-surface antialiased overflow-x-hidden selection:bg-inverse-surface selection:text-inverse-on-surface">
<!-- Main Hero Wrapper with Dark Texture -->
<main class="relative min-h-screen w-full bg-inverse-surface text-inverse-on-surface bg-grain overflow-hidden flex flex-col">
<!-- Background Archival/Editorial Details -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<!-- Faint circular ink wash / gradient -->
<div class="absolute top-1/4 -right-1/4 w-[800px] h-[800px] rounded-full bg-tertiary-container/30 blur-3xl opacity-50 mix-blend-multiply"></div>
<!-- Faint rule lines hinting at paper -->
<div class="absolute top-32 left-0 w-full h-[1px] bg-outline-variant/10"></div>
<div class="absolute bottom-32 left-0 w-full h-[1px] bg-outline-variant/10"></div>
<!-- Marginalia numbering -->
<div class="absolute top-1/2 left-8 md:left-margin-safe -translate-y-1/2 opacity-20 font-headline-md text-headline-md font-style-italic tracking-widest hidden md:block">
        [1]
      </div>
</div>
<!-- Navigation Bar (TopNavBar - Overlaid) -->
<nav class="content-overlay w-full top-0 sticky flex justify-between items-center h-16 px-gutter max-w-[1200px] mx-auto pt-stack-md z-50">
<div class="flex items-center">
<!-- Brand Logo -->
<a aria-label="Marginalia Home" class="font-headline-md text-headline-md text-inverse-on-surface tracking-tight" href="#">
          Marginalia
        </a>
</div>
<!-- Navigation Links -->
<div class="hidden md:flex items-center gap-stack-lg">
<a class="font-ui-medium text-ui-medium text-inverse-on-surface/70 hover:text-inverse-on-surface transition-colors duration-200" href="#">Product</a>
<a class="font-ui-medium text-ui-medium text-inverse-on-surface/70 hover:text-inverse-on-surface transition-colors duration-200" href="#">How it works</a>
<a class="font-ui-medium text-ui-medium text-inverse-on-surface/70 hover:text-inverse-on-surface transition-colors duration-200" href="#">Pricing</a>
<a class="font-ui-medium text-ui-medium text-inverse-on-surface/70 hover:text-inverse-on-surface transition-colors duration-200" href="#">Docs</a>
</div>
<!-- Trailing Primary Action -->
<div class="flex items-center">
<button class="px-4 py-2 border border-inverse-on-surface/30 text-inverse-on-surface font-label-bold text-label-bold hover:bg-inverse-on-surface/10 transition-all duration-200 uppercase tracking-widest">
          Start free
        </button>
</div>
</nav>
<!-- Hero Content -->
<div class="content-overlay flex-grow flex flex-col justify-center items-center text-center px-gutter max-w-[1200px] mx-auto w-full pb-section-gap">
<!-- Optional: Small overline/category -->
<div class="mb-stack-md font-label-bold text-label-bold uppercase tracking-[0.2em] text-inverse-on-surface/60">
        Archival Intelligence
      </div>
<!-- Main Headline -->
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-inverse-on-surface max-w-4xl mx-auto leading-tight mb-stack-lg">
<span class="italic font-light">Every answer,</span> <br class="md:hidden"/>sourced.
      </h1>
<!-- Subheadline -->
<p class="font-body-lg text-body-lg text-inverse-on-surface/80 max-w-2xl mx-auto mb-section-gap">
        Navigate the complexities of academic and professional research with a tool designed for deep work. No noise, just the citations you need.
      </p>
<!-- Primary Action in Hero -->
<button class="flex items-center gap-2 px-6 py-3 bg-inverse-on-surface text-inverse-surface border border-inverse-on-surface hover:bg-transparent hover:text-inverse-on-surface transition-all duration-300">
<span class="font-label-bold text-label-bold uppercase tracking-widest">Commence Search</span>
<span aria-hidden="true" class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 300;">arrow_right_alt</span>
</button>
<!-- Optional: Subtle scroll indicator down below -->
<div class="absolute bottom-margin-safe left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 opacity-50">
<span class="font-caption text-caption text-inverse-on-surface tracking-widest uppercase">Scroll</span>
<div class="w-[1px] h-12 bg-inverse-on-surface/30"></div>
</div>
</div>
