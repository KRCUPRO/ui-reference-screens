<script>
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = document.getElementById('features-carousel');
            const cards = document.querySelectorAll('.card-item');
            const dots = document.querySelectorAll('.dot-indicator');
            
            // Set initial state to card 2 (index 1) for mobile preview purposes, 
            // though actual scroll position relies on initial CSS layout
            let currentIndex = 1;

            // Optional: Simple scroll listener to update opacity and dots if user swipes
            carousel.addEventListener('scroll', () => {
                const scrollPosition = carousel.scrollLeft;
                const cardWidth = cards[0].offsetWidth;
                const gap = 32; // gutter
                
                // Very basic calculation for index based on scroll
                let newIndex = Math.round(scrollPosition / (cardWidth + gap));
                
                // Clamp index
                newIndex = Math.max(0, Math.min(newIndex, cards.length - 1));

                if (newIndex !== currentIndex) {
                    currentIndex = newIndex;
                    updateActiveState();
                }
            });

            function updateActiveState() {
                cards.forEach((card, index) => {
                    if (index === currentIndex) {
                        card.classList.remove('opacity-40');
                        card.classList.add('opacity-100');
                        
                        // Update icon style slightly for active
                        const icon = card.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-on-surface-variant');
                        icon.classList.add('text-primary');
                        icon.style.fontVariationSettings = "'FILL' 1";

                    } else {
                        card.classList.remove('opacity-100');
                        card.classList.add('opacity-40');

                        // Revert icon style
                        const icon = card.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-primary');
                        icon.classList.add('text-on-surface-variant');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    }
                });

                dots.forEach((dot, index) => {
                    if (index === currentIndex) {
                        dot.classList.remove('bg-surface-dim', 'border', 'border-outline-variant');
                        dot.classList.add('bg-primary');
                    } else {
                        dot.classList.remove('bg-primary');
                        dot.classList.add('bg-surface-dim', 'border', 'border-outline-variant');
                    }
                });
            }

            // Initialization logic to align on load if needed, but flex layout with padding handles it mostly.
            // On desktop, we might want to just show them all in a grid, but prompt specifies mobile-first swipeable row.
        });
    </script>
