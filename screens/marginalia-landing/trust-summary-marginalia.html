<h2 class="font-ui-medium text-ui-medium text-on-surface">Built with privacy in mind</h2>

<div class="flex overflow-x-auto gap-stack-sm pb-1 snap-x scrollbar-hide -mx-gutter px-gutter">

</div>

<ul class="flex flex-col gap-stack-sm font-body-md text-body-md text-on-surface-variant pl-2">
<li class="relative before:content-['-'] before:absolute before:-left-3">We never train on your documents</li>
<li class="relative before:content-['-'] before:absolute before:-left-3">Data encrypted in transit and at rest</li>
<li class="relative before:content-['-'] before:absolute before:-left-3">Delete your data anytime from settings</li>
</ul>

<a class="font-ui-medium text-ui-medium text-on-surface underline decoration-1 underline-offset-4 hover:text-primary transition-colors inline-block" href="#">Read full policy</a>
