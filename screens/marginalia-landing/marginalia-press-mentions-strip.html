<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Press Mentions Strip</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;700&amp;family=Source+Serif+4:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "error": "#ba1a1a",
                "tertiary-fixed": "#e6e2df",
                "on-primary-fixed-variant": "#474746",
                "error-container": "#ffdad6",
                "on-tertiary-container": "#868382",
                "outline": "#747878",
                "on-primary-container": "#858383",
                "on-primary": "#ffffff",
                "on-secondary-fixed": "#1b1c1c",
                "inverse-surface": "#313030",
                "surface-container-low": "#f7f3f2",
                "on-secondary-fixed-variant": "#474747",
                "surface-dim": "#ddd9d8",
                "background": "#fdf8f8",
                "surface-bright": "#fdf8f8",
                "tertiary-fixed-dim": "#cac6c4",
                "surface-container-highest": "#e5e2e1",
                "on-background": "#1c1b1b",
                "on-tertiary-fixed-variant": "#484645",

                "secondary-fixed": "#e4e2e1",
                "on-surface": "#1c1b1b",

                "margin-page": "16px",
                "unit": "4px",
                "row-gap": "4px",
                "gutter": "8px",

              "fontFamily": {
                "label-caps": [
                  "Archivo Narrow"
                ],
                "body-md": [
                  "\"Source Serif 4\""
                ],
                "headline-lg": [
                  "\"Source Serif 4\""
                ],
                "headline-md": [
                  "\"Source Serif 4\""
                ],
                "footer-note": [
                  "Archivo Narrow"
                ],
                "body-sm": [
                  "\"Source Serif 4\""
                ]
              },
              "fontSize": {
                "label-caps": [
                  "11px",
                  {
                    "lineHeight": "12px",
                    "letterSpacing": "0.08em",
                    "fontWeight": "700"
                  }
                ],
                "body-md": [
                  "14px",
                  {
                    "lineHeight": "18px",
                    "fontWeight": "400"
                  }
                ],
                "headline-lg": [
                  "30px",

                    "lineHeight": "32px",

                "footer-note": [

                    "lineHeight": "14px",
                    "letterSpacing": "0.01em",
                    "fontWeight": "400"

                ],
                "body-sm": [
                  "12px",
                  {
                    "lineHeight": "16px",
                    "fontWeight": "400"

                ]

            },
          },

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-4">
<!-- Press Mentions Strip -->
<div class="w-full max-w-[800px] border-y border-primary bg-surface-container-high h-[64px] flex items-center overflow-hidden">
<div class="flex items-center space-x-[16px] px-margin-page overflow-x-auto no-scrollbar w-full h-full snap-x">
<!-- Logo 1: TechCrunch -->
<div class="flex flex-col items-center justify-center flex-shrink-0 border-r border-primary pr-[16px] snap-start h-full">
<span class="font-headline-md text-headline-md text-primary tracking-tight" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px;">TECHCRUNCH</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
</div>
<!-- Logo 2: Wired -->
<div class="flex flex-col items-center justify-center flex-shrink-0 border-r border-primary pr-[16px] snap-start h-full">
<span class="font-headline-md text-headline-md text-primary tracking-wide uppercase" style="font-family: 'Georgia', serif; font-weight: 700; letter-spacing: 2px;">WIRED</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
</div>
<!-- Logo 3: Fast Company -->
<div class="flex flex-col items-center justify-center flex-shrink-0 border-r border-primary pr-[16px] snap-start h-full">
<span class="font-headline-md text-headline-md text-primary italic" style="font-family: 'Times New Roman', Times, serif; font-weight: 700;">FastCompany</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
</div>
<!-- Logo 4: The Verge -->
<div class="flex flex-col items-center justify-center flex-shrink-0 border-r border-primary pr-[16px] snap-start h-full">
<span class="font-headline-md text-headline-md text-primary" style="font-family: 'Arial Black', Gadget, sans-serif; text-transform: lowercase; font-weight: 900; letter-spacing: -0.5px;">theverge</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
</div>
<!-- Logo 5: Product Hunt -->
<div class="flex flex-col items-center justify-center flex-shrink-0 border-r border-primary pr-[16px] snap-start h-full">
<span class="font-headline-md text-headline-md text-primary font-bold" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">P H</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
</div>
<!-- Logo 6: Partial / Forbes (Cropped) -->
<div class="flex flex-col items-center justify-center flex-shrink-0 snap-start h-full opacity-50 relative pr-4">
<span class="font-headline-md text-headline-md text-primary" style="font-family: 'Didot', 'Bodoni MT', serif; font-weight: 700;">Forbes</span>
<span class="font-footer-note text-footer-note text-on-surface-variant uppercase mt-1">FEATURED</span>
<div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-surface-container-high to-transparent pointer-events-none"></div>
</div>
</div>
</div>
