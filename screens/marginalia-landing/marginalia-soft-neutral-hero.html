<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Marginalia - Digital Commonplace Book</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "tertiary": "#00685d",
            "on-background": "#1d1c13",
            "on-secondary-container": "#706145",
            "surface-tint": "#96482d",
            "on-secondary": "#ffffff",
            "secondary-fixed-dim": "#d8c4a2",
            "on-surface": "#1d1c13",
            "on-primary-fixed-variant": "#783118",
            "on-tertiary-fixed": "#00201c",
            "on-error": "#ffffff",
            "background": "#fef9ea",
            "secondary": "#6b5c41",
            "on-tertiary-fixed-variant": "#005048",
            "surface-dim": "#dedacb",
            "secondary-fixed": "#f5e0bd",
            "error-container": "#ffdad6",
            "on-primary-container": "#fffbff",
            "surface-container-lowest": "#ffffff",
            "on-primary-fixed": "#390c00",
            "primary-container": "#b15d40",
            "inverse-primary": "#ffb59d",
            "primary-fixed": "#ffdbd0",
            "tertiary-container": "#008376",
            "on-secondary-fixed": "#241a05",

            "surface-container": "#f3eedf",
            "on-surface-variant": "#55433d",
            "on-tertiary": "#ffffff",
            "on-primary": "#ffffff",
            "outline-variant": "#dac1ba",
            "surface-container-high": "#ede8d9",
            "surface": "#fef9ea",
            "surface-variant": "#e7e2d4",
            "on-tertiary-container": "#f4fffb",
            "inverse-on-surface": "#f6f1e2",
            "secondary-container": "#f2ddba",
            "surface-container-low": "#f8f3e4"
          },
          "borderRadius": {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          "spacing": {
            "base": "8px",
            "section-gap": "64px",
            "gutter": "16px",
            "container-margin": "24px",
            "card-padding": "32px"
          },
          "fontFamily": {
            "headline-lg": ["Quicksand"],
            "label-sm": ["Quicksand"],
            "headline-md": ["Quicksand"],
            "headline-lg-mobile": ["Quicksand"],
            "body-lg": ["Quicksand"],
            "label-md": ["Quicksand"],
            "body-md": ["Quicksand"],
            "headline-xl": ["Quicksand"]

          "fontSize": {
            "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],

        },
      },

<body class="bg-[#F5F0E1] text-on-background font-body-lg min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim shadow-[0_4px_12px_rgba(217,197,163,0.3)] w-full sticky top-0 z-50">
<div class="flex justify-between items-center w-full px-container-margin py-4 max-w-[1120px] mx-auto">
<div class="text-headline-md font-headline-md font-semibold text-primary dark:text-primary-fixed-dim">
        Marginalia
      </div>
<div class="flex items-center gap-4 text-secondary dark:text-secondary-fixed-dim">
<button class="hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors duration-200 p-2 rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button class="hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors duration-200 p-2 rounded-full active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center py-section-gap px-container-margin">
<div class="relative w-full max-w-[800px] mx-auto">
<!-- Hero Card -->
<div class="bg-surface-container-lowest rounded-xl p-section-gap shadow-[0_24px_48px_rgba(217,197,163,0.3)] border border-[#D9C5A3]/40 flex flex-col items-center text-center relative z-10">
<h1 class="text-headline-xl font-headline-xl text-on-surface mb-gutter max-w-2xl">
          Find the answer, and the sentence it came from
        </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant mb-card-padding">
          9,844 documents ready to search
        </p>
<button class="bg-[#C36B4D] text-on-primary rounded-full px-8 py-3 text-label-md font-label-md hover:bg-primary-container transition-colors shadow-[0_8px_24px_rgba(217,197,163,0.4)]">
          Try it free
        </button>
</div>
<!-- Floating Citation Chip -->
<div class="absolute left-1/2 -bottom-6 -translate-x-1/2 z-20">
<div class="bg-[#ECE6D5] text-on-surface-variant rounded-full px-4 py-2 flex items-center gap-2 shadow-[0_4px_12px_rgba(217,197,163,0.2)] border border-[#D9C5A3]/30">
<span class="material-symbols-outlined text-sm" data-icon="description">description</span>
<span class="text-label-sm font-label-sm">Onboarding Runbook, section 4</span>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container dark:bg-surface-container-high border-t border-outline-variant/40 mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-container-margin py-12 gap-8 max-w-[1120px] mx-auto">
<div class="text-label-md font-label-md font-bold text-secondary dark:text-secondary-fixed-dim">
        © 2024 Marginalia. A digital commonplace book.
      </div>
<nav class="flex flex-wrap gap-6 text-label-md font-label-md">
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim underline decoration-tertiary transition-all focus:outline-none focus:ring-2 focus:ring-tertiary-container rounded" href="#">Archives</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim underline decoration-tertiary transition-all focus:outline-none focus:ring-2 focus:ring-tertiary-container rounded" href="#">Library</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim underline decoration-tertiary transition-all focus:outline-none focus:ring-2 focus:ring-tertiary-container rounded" href="#">Methods</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim underline decoration-tertiary transition-all focus:outline-none focus:ring-2 focus:ring-tertiary-container rounded" href="#">About</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed-dim underline decoration-tertiary transition-all focus:outline-none focus:ring-2 focus:ring-tertiary-container rounded" href="#">Privacy</a>
</nav>
</div>
</footer>
</body></html>
